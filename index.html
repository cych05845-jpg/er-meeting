<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>急診會議整合平台</title>
<meta name="claude:viewport-fit-sides" content="cover">
<script src="/account/edauth.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
/* Layout: 頂部品牌列＋分頁列；首頁為「本月會議」主卡＋公告／投票／提議／決議四區；其他分頁單欄。最寬 1180px。 */
:root{
  --bg:#F7F4EF; --surface:#FFFFFE; --line:#E6DED4; --fg:#1F3A3E; --fg-2:#4D5C5A; --fg-3:#7D8784;
  --accent:#CF4A3A; --accent-soft:#FBE3DD; --ink:#1E5A64; --ink-2:#2A7380; --ink-fg:#F6F8F7; --ink-mute:#CFE6E8;
  --ok:#2878C0; --ok-soft:#DFECF8; --warn:#A8640F; --warn-soft:#F8E8CF; --teal:#1F7A6E; --teal-soft:#DDF0EC;
  --f:"Microsoft JhengHei","微軟正黑體","PingFang TC","Noto Sans TC",sans-serif;
  --r:16px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121A1C; --surface:#1A2527; --line:#2C3A3C; --fg:#E8EEEC; --fg-2:#B9C6C3; --fg-3:#8A9895;
  --accent:#F08A7C; --accent-soft:#3D2420; --ink:#174850; --ink-2:#1F5C66; --ink-fg:#EEF5F4; --ink-mute:#AFCFD3;
  --ok:#8DBDEB; --ok-soft:#1B2C3C; --warn:#E8B867; --warn-soft:#352915; --teal:#7FD1C2; --teal-soft:#16302C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121A1C; --surface:#1A2527; --line:#2C3A3C; --fg:#E8EEEC; --fg-2:#B9C6C3; --fg-3:#8A9895;
  --accent:#F08A7C; --accent-soft:#3D2420; --ink:#174850; --ink-2:#1F5C66; --ink-fg:#EEF5F4; --ink-mute:#AFCFD3;
  --ok:#8DBDEB; --ok-soft:#1B2C3C; --warn:#E8B867; --warn-soft:#352915; --teal:#7FD1C2; --teal-soft:#16302C; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--f);font-size:18.5px;line-height:1.65}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--ink)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--ink-2)}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--ink);color:var(--ink-fg);box-shadow:0 2px 12px rgba(0,0,0,.08)}
.hrow{display:flex;align-items:center;gap:16px;min-height:56px;padding-block:6px}
.brand{display:flex;align-items:center;gap:12px;font-weight:700;font-size:22px;letter-spacing:.03em;flex:1;min-width:0}
.brand .mark{width:34px;height:34px;border-radius:10px;background:var(--accent);display:grid;place-items:center;flex:none}
.brand small{display:block;font-weight:400;font-size:14px;letter-spacing:.14em;color:var(--ink-mute)}
.who{font-size:16px;display:flex;gap:10px;align-items:center;color:var(--ink-mute)}
.who button{background:transparent;border:1px solid rgba(255,255,255,.3);color:var(--ink-fg);border-radius:999px;padding:3px 12px;cursor:pointer}
nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin-bottom:-1px}
nav::-webkit-scrollbar{display:none}
nav a{color:var(--ink-mute);text-decoration:none;padding:9px 14px 11px;white-space:nowrap;border-bottom:3px solid transparent;display:flex;gap:6px;align-items:center}
nav a:hover{color:var(--ink-fg)}
nav a[aria-current="page"]{color:var(--ink-fg);border-bottom-color:var(--accent);font-weight:700}
nav .badge{background:var(--accent);color:#fff;border-radius:999px;font-size:12.5px;padding:0 6px;line-height:17px;font-weight:700}
main{padding-block:26px 72px}
h1{font-size:32px;line-height:1.3;margin:0;text-wrap:balance}
h2{font-size:22px;margin:0;line-height:1.35}
h3{font-size:18.5px;margin:0}
.eyebrow{font-size:14.5px;letter-spacing:.16em;color:var(--accent);font-weight:700}
.muted{color:var(--fg-3)}
.small{font-size:16px}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;min-width:0}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:12px}
.sec-head a{font-size:16px;text-decoration:none}
.banner{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 14px;font-size:16px}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
/* 首頁 */
.hero{background:var(--ink);color:var(--ink-fg);border:none;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:center;padding:26px 28px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:240px;height:240px;border-radius:50%;border:28px solid rgba(255,255,255,.06);pointer-events:none}
.hero .eyebrow{color:#FFB59C}
.hero h1{font-size:34.5px}
.hero .meta{color:var(--ink-mute);font-size:17px}
.hero .facts{display:flex;gap:22px;flex-wrap:wrap;margin-top:14px}
.hero .facts div{display:flex;flex-direction:column}
.hero .facts b{font-size:30px;line-height:1.1;font-variant-numeric:tabular-nums}
.hero .facts span{font-size:15px;color:var(--ink-mute)}
.dash{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px}
@media (max-width:860px){.dash{grid-template-columns:1fr}.hero{grid-template-columns:1fr}}
/* 公告 */
.ann{display:grid;grid-template-columns:58px minmax(0,1fr);gap:14px;padding:14px 0;border-top:1px solid var(--line)}
.ann:first-child{border-top:none;padding-top:2px}
.date{width:58px;border-radius:10px;overflow:hidden;text-align:center;border:1px solid var(--line);background:var(--surface);align-self:start}
.date .m{background:var(--accent);color:#fff;font-size:13px;font-weight:700;letter-spacing:.06em;padding:2px 0}
.date .d{font-size:25.5px;font-weight:700;line-height:1.35;font-variant-numeric:tabular-nums}
.date .w{font-size:12.5px;color:var(--fg-3);padding-bottom:3px}
.date.none .m{background:var(--fg-3)}
.ann h3{font-size:19px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ann p{margin:3px 0 0;color:var(--fg-2);font-size:17px;white-space:pre-wrap}
.pin{font-size:14px;color:var(--accent);font-weight:700}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:14.5px;padding:1px 9px;border-radius:999px;background:var(--bg);color:var(--fg-2);border:1px solid var(--line);white-space:nowrap;font-weight:500}
.chip.hot{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.chip.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.teal{background:var(--teal-soft);color:var(--teal);border-color:transparent}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 14px;cursor:pointer;font-size:16.5px}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--ink-fg);border-color:var(--ink)}
/* 按鈕與表單 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 16px;cursor:pointer;text-decoration:none;color:var(--fg);font-size:17px}
.btn:hover{border-color:var(--ink-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.light{background:var(--ink-fg);border-color:var(--ink-fg);color:var(--ink)}
.btn.big{padding:12px 22px;font-size:19px;font-weight:700}
.btn[disabled]{opacity:.55;cursor:default}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:16px;color:var(--fg-2);min-width:0}
input,select,textarea{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px;width:100%}
textarea{min-height:90px;resize:vertical}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.check{display:flex;gap:8px;align-items:center;font-size:16.5px;color:var(--fg-2)}
.check input{width:auto}
/* 會議列表 */
.year{font-size:15px;color:var(--fg-3);letter-spacing:.14em;font-weight:700;margin-top:6px}
.mlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.mcard{display:flex;flex-direction:column;gap:8px;text-decoration:none;color:inherit;transition:border-color .15s,transform .15s}
.mcard:hover{border-color:var(--ink-2);transform:translateY(-2px)}
.mcard .mon{font-size:37px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.mcard .mon span{font-size:16px;color:var(--fg-3);font-weight:400;margin-left:6px}
.mcard p{margin:0;color:var(--fg-2);font-size:16.5px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.report-hero{display:flex;gap:20px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--ink);color:var(--ink-fg);border:none}
.report-hero .t{font-size:22px;font-weight:700}
.report-hero .muted{color:var(--ink-mute)}
.files .file{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.files .file:first-child{border-top:none}
.file .n{flex:1;min-width:0;overflow-wrap:anywhere}
/* 表格 */
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:17px}
th,td{text-align:left;padding:10px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:14.5px;color:var(--fg-3);font-weight:700;letter-spacing:.06em;white-space:nowrap}
td.item{min-width:220px}
/* 投票 */
.poll .opt{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.bar{position:relative;height:40px;border-radius:10px;background:var(--bg);overflow:hidden;display:flex;align-items:center;padding:0 12px;border:1px solid var(--line)}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--accent-soft);transition:width .6s ease}
.bar>span{position:relative;display:flex;justify-content:space-between;width:100%;font-variant-numeric:tabular-nums;gap:10px}
.bar>span>b{white-space:nowrap}
.bar.win span b{color:var(--accent)}
.vote-btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.vote-btns .btn{flex:1;min-width:120px;padding:12px 16px;font-weight:700}
/* 提議 */
.prop{display:grid;grid-template-columns:64px minmax(0,1fr);gap:14px;padding:16px 0;border-top:1px solid var(--line)}
.prop:first-child{border-top:none;padding-top:2px}
.second{display:flex;flex-direction:column;align-items:center;gap:2px;border:1px solid var(--line);border-radius:12px;padding:8px 0;background:var(--surface);cursor:pointer;align-self:start;width:64px}
.second b{font-size:23px;line-height:1;font-variant-numeric:tabular-nums}
.second span{font-size:14px;color:var(--fg-3)}
.second[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.second[aria-pressed="true"] b,.second[aria-pressed="true"] span{color:var(--accent)}
.prop p{margin:4px 0 0;color:var(--fg-2);font-size:17px;white-space:pre-wrap}
.reply{margin-top:8px;background:var(--bg);border-radius:10px;padding:8px 12px;font-size:16.5px;color:var(--fg-2)}
.reply b{color:var(--ink-2)}
.statbar{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.statbar div{background:var(--bg);border-radius:10px;padding:10px 12px}
.statbar b{display:block;font-size:27.5px;line-height:1.1;font-variant-numeric:tabular-nums}
.statbar span{font-size:15px;color:var(--fg-3)}
.login{max-width:400px;margin:7vh auto 0}
.err{color:var(--accent);font-size:16px;min-height:1.4em}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--ink-fg);padding:10px 18px;border-radius:999px;z-index:30;font-size:17px;box-shadow:0 6px 20px rgba(0,0,0,.2)}
#viewer{position:fixed;inset:0;z-index:40;background:#0e1516;display:flex;flex-direction:column}
#viewer .vbar{display:flex;align-items:center;gap:12px;padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));color:#E8EEEC;margin-top:env(safe-area-inset-top,0px)}
#viewer .vbar b{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#viewer .vbar button{background:transparent;color:#E8EEEC;border:1px solid #3b4b4c;border-radius:999px;padding:5px 14px;cursor:pointer}
#viewer iframe,#viewer img{flex:1;width:100%;border:0;background:#2b3538;object-fit:contain;min-height:0}
.learn{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:center}
.qrbox{background:#fff;padding:10px;border-radius:12px;border:1px solid var(--line);line-height:0;width:max-content}
.qrbox img,.qrbox canvas{display:block}
.hbtn{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:var(--ink-fg);border-radius:999px;padding:4px 12px;cursor:pointer;font-size:16px;white-space:nowrap}
#qrModal{position:fixed;inset:0;z-index:45;background:rgba(10,20,22,.82);display:flex;align-items:center;justify-content:center;padding:16px}
#qrModal .panel{background:var(--surface);color:var(--fg);border-radius:20px;padding:28px;max-width:min(560px,100%);width:100%;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
#qrModal .qrbox{padding:16px}
#qrModal .url{font-size:17px;color:var(--fg-2);overflow-wrap:anywhere}
.empty{padding:22px;text-align:center;color:var(--fg-3)}
.btn.sm{padding:3px 12px;font-size:15.5px}
#busy{position:fixed;left:0;top:0;height:3px;width:100%;z-index:60;pointer-events:none;background:linear-gradient(90deg,transparent,var(--accent),transparent);background-size:40% 100%;background-repeat:no-repeat;animation:busy 1s linear infinite}
@keyframes busy{from{background-position:-40% 0}to{background-position:140% 0}}
@media (prefers-reduced-motion:reduce){#busy{animation:none;background:var(--accent);opacity:.6}}
#viewer .vbar a{color:#E8EEEC;border:1px solid #3b4b4c;border-radius:999px;padding:5px 14px;text-decoration:none;font-size:16px;white-space:nowrap}
#viewer .vbar button{white-space:nowrap}
#viewer .vnote{color:#9fb1b0;font-size:15px;padding:4px 16px 8px}
@media (max-width:640px){#viewer .vbar{flex-wrap:wrap}#viewer .vbar b{flex-basis:100%}}
.steps{display:flex;gap:0;list-style:none;margin:0;padding:0;counter-reset:st;flex-wrap:wrap}
.steps li{flex:1;min-width:120px;position:relative;padding:8px 10px 8px 34px;font-size:15px;color:var(--fg-3);border-bottom:3px solid var(--line)}
.steps li::before{counter-increment:st;content:counter(st);position:absolute;left:6px;top:7px;width:22px;height:22px;border-radius:50%;background:var(--line);color:var(--fg-2);display:grid;place-items:center;font-size:13px;font-weight:700}
.steps li.done{color:var(--fg-2);border-color:var(--teal)}.steps li.done::before{content:'✓';background:var(--teal);color:#fff}
.steps li.cur{color:var(--fg);font-weight:700;border-color:var(--accent)}.steps li.cur::before{background:var(--accent);color:#fff}
.furow{display:grid;grid-template-columns:auto minmax(0,2.2fr) minmax(0,1fr) auto auto auto;gap:8px;align-items:center}
.furow input[type=checkbox]{width:auto}
@media (max-width:760px){.furow{grid-template-columns:auto 1fr 1fr}.furow>input:nth-child(2){grid-column:2/4}}
fieldset.opts{border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:0;display:flex;flex-direction:column;gap:8px}
fieldset.opts legend{padding:0 6px;font-weight:700;color:var(--fg-2)}
.actbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 14px;border-radius:12px;background:var(--bg)}
.actbar:empty{display:none}
.warnbar{background:var(--accent-soft)!important;color:var(--accent)!important}
a.nextm{padding:10px 2px;border-top:1px solid var(--line);color:var(--fg);text-decoration:none}a.nextm:first-child{border-top:none}a.nextm:hover{color:var(--accent)}
#vbody audio{width:min(640px,90%);margin:auto}
.btn.danger{color:var(--accent);border-color:var(--accent-soft)}
.edit-box{background:var(--bg);border-radius:12px;padding:12px 14px;margin-top:8px}
details.mgr{margin-top:12px;border-top:1px dashed var(--line);padding-top:8px}
details.mgr summary{cursor:pointer;color:var(--fg-3);font-size:16px}
tr.overdue td{background:var(--accent-soft)}
.ver{display:flex;gap:10px;align-items:center;padding:6px 0;border-top:1px solid var(--line);font-size:16.5px;flex-wrap:wrap}
.ver:first-child{border-top:none}
.readbar{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--ok-soft);color:var(--ok);border-radius:12px;padding:12px 16px}
.att-no{font-weight:700;color:var(--ink-2);white-space:nowrap}
.addbox{background:var(--bg);border-radius:12px;padding:12px 14px}
.kiosk{display:flex;flex-direction:column;gap:14px}
.kin{font-size:39px;padding:14px 18px;text-align:center;letter-spacing:.12em;font-variant-numeric:tabular-nums;border-width:2px;border-color:var(--ink-2)}
.kmsg{min-height:78px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:700;text-align:center;padding:12px;background:var(--bg);color:var(--fg-3)}
.kmsg.ok{background:var(--teal-soft);color:var(--teal)}
.kmsg.bad{background:var(--accent-soft);color:var(--accent)}
.kmsg.warn{background:var(--warn-soft);color:var(--warn)}
#k_reader{max-width:420px;width:100%;margin:0 auto;border-radius:12px;overflow:hidden}
.alist{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.alist .p{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:16.5px;min-width:0}
.alist .p .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.alist .p.leave{background:var(--bg);color:var(--fg-3)}
.alist .p button{border:none;background:none;color:var(--fg-3);cursor:pointer;padding:0 2px;font-size:18.5px}
.bigpoll .poll h2{font-size:27.5px}
.bigpoll .vote-btns .btn{font-size:23px;padding:18px}
@media (max-width:560px){.lq{display:none}.brand>span:last-child{white-space:nowrap}.brand{font-size:17.5px;gap:8px}.brand small{display:none}.brand .mark{width:30px;height:30px}.hrow{gap:8px}.hbtn{padding:3px 9px;font-size:13.5px}.who{gap:6px}.statbar{grid-template-columns:repeat(2,minmax(0,1fr))}.hero h1{font-size:28.5px}.who span{display:none}}
@media (prefers-reduced-motion:reduce){.mcard,.bar i{transition:none}}
</style>
</head>
<body>
<header><div class="wrap">
  <div class="hrow">
    <div class="brand"><span class="mark" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24"><path fill="#fff" d="M9.5 3h5v6.5H21v5h-6.5V21h-5v-6.5H3v-5h6.5z"/></svg></span>
      <span>急診會議整合平台<small>ER MEETING HUB</small></span></div>
    <button type="button" class="hbtn" id="learnBtn" aria-haspopup="dialog" aria-label="ER-Learn QR"><span class="lq">ER-Learn </span>QR</button>
    <div class="who" id="who"></div>
  </div>
  <nav id="nav" aria-label="主選單"></nav>
</div></header>
<main class="wrap" id="app"></main>
<div id="qrModal" hidden role="dialog" aria-modal="true" aria-labelledby="qrTitle">

/* ===== 讀取快取（加速）=====
   1. 同一筆資料 60 秒內直接用快取。
   2. 超過 60 秒：先顯示上次的資料（含上次開網站時存在本機的），背景再向後端更新；有變動才自動重畫。

const READS = new Set(['listMeetings','listAnnouncements','listPolls','listProposals','listDecisions','getMeeting','listAttendance','getMinutes','getFile','listMinutesLog','listSeries','myTasks']);

let persistT = 0;
function persist(){ if (DEMO) return; clearTimeout(persistT); persistT = setTimeout(() => { const o = {}; let size = 0;
  for (const [k,v] of qcache) { if (NOPERSIST.has(k.split('|')[0])) continue; const s = JSON.stringify(v.data); if (size + s.length > 1.8e6) break; size += s.length; o[k] = v.data; }
  store.set(pkey(), o); }, 800); }
let rerenderT = 0;
function scheduleRerender(){ clearTimeout(rerenderT); rerenderT = setTimeout(() => {
  const typing = document.activeElement && document.activeElement.matches('input,textarea,select');
  if (formDirty || typing || !$('#viewer').hidden || !$('#qrModal').hidden || busyN) return;
  const y = scrollY; render().then(() => scrollTo(0, y));

const inflight = new Map();
function revalidate(calls){
  const todo = calls.filter(([a,b]) => !inflight.has(qkey(a,b)));
  if (!todo.length) return;
  const p = (todo.length === 1 ? apiRaw(todo[0][0], todo[0][1]||{}).then(d=>[{ok:true,data:d}])
    : DEMO ? Promise.all(todo.map(([a,b])=>mock(a,b||{}).then(data=>({ok:true,data})))) : apiRaw('batch', {calls: todo.map(([a,b])=>({action:a, ...(b||{})}))}))
    .then(res => { let changed = false;
      res.forEach((r,i) => { if (!r.ok) return; const k = qkey(todo[i][0], todo[i][1]); const old = qcache.get(k);
        if (!old || JSON.stringify(old.data) !== JSON.stringify(r.data)) changed = true;
        qcache.set(k, {t:Date.now(), data:clone(r.data)}); });
      persist(); if (changed) scheduleRerender(); })
    .catch(() => {}).finally(() => todo.forEach(([a,b]) => inflight.delete(qkey(a,b))));
  todo.forEach(([a,b]) => inflight.set(qkey(a,b), p));
}
async function api(action, body={}){
  if (READS.has(action)) {
    const k = qkey(action, body), h = qcache.get(k);
    if (h && Date.now() - h.t < (action==='getFile' ? 6e5 : FRESH)) return clone(h.data);
    if (h && Date.now() - lastWrite > 15000 && !NOPERSIST.has(action)) { revalidate([[action, body]]); return clone(h.data); }
  } else { lastWrite = Date.now(); qcache.forEach(v => { v.t = 0; }); }
  busy(1);
  try { const d = await apiRaw(action, body); if (READS.has(action)) { qcache.set(qkey(action, body), {t:Date.now(), data:clone(d)}); persist(); } return d; }
  finally { busy(-1); }
}
/** 一次送出多個讀取（首頁、會議頁）；有舊資料就先用，背景更新 */
async function apiBatch(calls){
  const now = Date.now(), recentWrite = now - lastWrite < 15000;
  const need = calls.filter(([a,b]) => { const h = qcache.get(qkey(a,b)); return !h || (recentWrite && now - h.t >= FRESH); });
  const stale = calls.filter(c => { const h = qcache.get(qkey(c[0],c[1])); return h && !need.includes(c) && now - h.t >= FRESH; });
  if (need.length) {
    busy(1);
    try {
      const res = DEMO ? await Promise.all(need.map(([a,b])=>mock(a,b||{}).then(data=>({ok:true,data})).catch(e=>({ok:false,error:e.message}))))
                       : await apiRaw('batch', {calls: need.map(([a,b])=>({action:a, ...(b||{})}))});
      res.forEach((r,i) => { if (!r.ok) throw new Error(r.error); qcache.set(qkey(need[i][0], need[i][1]), {t:Date.now(), data:clone(r.data)}); });
      persist();
    } finally { busy(-1); }
  }
  if (stale.length) revalidate(stale);
  return calls.map(([a,b]) => clone(qcache.get(qkey(a,b)).data));
}
async function apiRaw(action, body={}){
  if (DEMO) return mock(action, body);
  let j;
  if (CENTER()) j = await EDAuth.api(CONFIG.API_URL, {action, ...body});   // 帳號中心 token；過期會跳出登入後重送
  else {
    const r = await fetch(CONFIG.API_URL, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({action, token: session?.token, ...body})});
    j = await r.json();
    if (!j.ok && j.error === 'AUTH_REQUIRED') { logout(true); throw new Error('請重新登入'); }
  }
  if (!j.ok) throw new Error(j.error === 'FORBIDDEN' ? '沒有權限' : j.error);
  return j.data;
}
function logout(expired){

  store.del(pkey()); session = null; store.del('erm_session'); qcache.clear(); if (expired) toast('登入已過期，請重新登入'); location.hash = '#/home'; render();
}

    else if (r==='live' && a) await renderLive(app, a);
    else if (r==='vote' && a) await renderVote(app, a);
    else if (r==='news') await renderNews(app);
    else if (r==='records') await renderRecords(app);
    else if (r==='polls') await renderPolls(app);
    else if (r==='proposals') await renderProposals(app);
    else if (r==='decisions') await renderDecisions(app);
    else if (r==='admin' && isAdmin()) await renderAdmin(app);
    else await renderHome(app);
  } catch(e){ app.innerHTML = `<div class="card">${esc(e.message)}</div>`; }
  window.scrollTo(0,0);
}

  else el.innerHTML = `<div style="width:${size}px;height:${size}px;display:grid;place-items:center;color:#555;font-size:15px;line-height:1.4;padding:8px">QR 載入失敗<br>請用下方連結</div>`;
}

/* ===== 投票 ===== */
function pollCard(p, compact){
  const max = p.counts ? Math.max(...p.counts) : 0;
  const pct = i => p.total ? Math.round(p.counts[i]/p.total*100) : 0;
  return `<div class="${compact?'':'card '}poll" data-poll="${esc(p.poll_id)}">
    <div class="row between"><h2>${esc(p.question)}</h2>
    <div class="row"><span class="chip ${p.open?'hot':''}">${p.open?'進行中':'已截止'}${p.close_at?'・截止 '+esc(p.close_at):''}</span>${p.open?`<button class="btn sm" type="button" data-pollqr data-q="${esc(p.question)}">投票 QR</button>`:''}</div></div>
    <div class="muted small">不記名、一人一票，系統只記錄是否投過，不記錄投給誰。已投 ${p.total} 票${compact?'':'・<a href="#/m/'+esc(p.meeting_id)+'">'+esc(p.meeting_id)+' 會議</a>'}</div>
    ${p.counts ? `<div class="opt">${p.options.map((o,i)=>`<div class="bar ${p.counts[i]===max&&max>0?'win':''}"><i style="width:${pct(i)}%"></i><span><b>${esc(o)}</b><span>${p.counts[i]} 票・${pct(i)}%</span></span></div>`).join('')}</div>${p.voted?'<div class="muted small" style="margin-top:8px">您已投票</div>':''}` : ''}
    ${p.open && !p.voted ? `<div class="vote-btns">${p.options.map(o=>`<button class="btn" type="button" data-vote="${esc(o)}">${esc(o)}</button>`).join('')}</div>` : ''}
    ${!compact && isAdmin() ? `<details class="mgr"><summary>管理這個投票</summary><form class="stack" style="gap:10px;margin-top:8px" data-pedit>
      <div class="grid2"><label class="f">題目<input name="question" value="${esc(p.question)}"></label><label class="f">截止日<input name="close_at" type="date" value="${esc(String(p.close_at||'').slice(0,10))}"></label></div>
      <label class="f">選項（一行一個）${p.total?'<span class="muted small">已有人投票，選項不能修改</span>':''}<textarea name="options" ${p.total?'disabled':''}>${esc(p.options.join('\n'))}</textarea></label>
      <div class="row"><button class="btn primary sm" type="submit">儲存</button><button class="btn sm" type="button" data-pstat="${p.open?'closed':'open'}">${p.open?'提前截止':'重新開放'}</button><button class="btn sm danger" type="button" data-pdel>刪除投票</button></div></form></details>` : ''}
  </div>`;
}
function bindPolls(root){
  root.querySelectorAll('[data-poll]').forEach(card=>{
    const pe = card.querySelector('[data-pedit]');
    if (pe) { const pid = card.dataset.poll; const compact = !card.classList.contains('card');
      const upd = async (poll, msg) => { try{ const p = await api('updatePoll',{poll_id:pid, poll}); card.outerHTML = pollCard(p, compact); bindPolls(root); toast(msg); }catch(e){toast(e.message)} };
      pe.onsubmit = e => { e.preventDefault(); const fd=new FormData(pe); const poll={question:fd.get('question'), close_at:fd.get('close_at')}; if(!pe.options.disabled) poll.options=String(fd.get('options')).split('\n'); upd(poll,'已更新投票'); };
      pe.querySelector('[data-pstat]').onclick = ev => upd({status:ev.target.dataset.pstat}, ev.target.dataset.pstat==='closed'?'已截止':'已重新開放');
      pe.querySelector('[data-pdel]').onclick = async () => { if(!confirm('刪除投票會連同所有票數一起刪除，確定嗎？')) return; try{ await api('deletePoll',{poll_id:pid}); card.remove(); toast('已刪除投票'); }catch(e){toast(e.message)} };
    }
    const qb = card.querySelector('[data-pollqr]');
    if (qb) qb.onclick = () => openQR({eyebrow:'現場投票', title:qb.dataset.q, desc:'手機掃描 → 登入 → 投票（不記名、一人一票）', url:SITE()+'#/vote/'+card.dataset.poll});
    card.querySelectorAll('[data-vote]').forEach(btn=>btn.onclick=async()=>{
      card.querySelectorAll('button').forEach(x=>x.disabled=true);
      try{ const p=await api('vote',{poll_id:card.dataset.poll,option:btn.dataset.vote}); card.outerHTML=pollCard(p, !card.classList.contains('card')); toast('已投票，謝謝！'); }
      catch(e){ toast(e.message); card.querySelectorAll('button').forEach(x=>x.disabled=false); }
    });
  });
}
async function renderPolls(app){
  const polls = await api('listPolls');
  const open = polls.filter(p=>p.open), closed = polls.filter(p=>!p.open);
  app.innerHTML = `<div class="stack">${demoBanner()}${pageHead('投票','會議投票', isAdmin()?'<a class="btn primary" href="#/admin">＋ 新增投票</a>':'')}
    <h2>進行中</h2>${open.map(p=>pollCard(p)).join('') || '<div class="card empty">目前沒有進行中的投票</div>'}
    ${closed.length?`<h2>已截止</h2>${closed.map(p=>pollCard(p)).join('')}`:''}</div>`;
  bindPolls(app);
}

function propItem(p){

    <button type="button" class="second" aria-pressed="${p.seconded}" aria-label="附議，目前 ${p.seconds} 人"><b>${p.seconds}</b><span>${p.seconded?'已附議':'附議'}</span></button>
    <div style="min-width:0"><div class="row"><h3 style="font-size:19px">${esc(p.title)}</h3>${propChip(p.status)}<span class="chip teal">${esc(p.series_name||seriesName(p.series))}</span><span class="chip">${esc(p.category)}</span></div>
    <div class="muted small">${esc(p.proposer||'')}・${esc(p.created_at)}${p.meeting_id?`・排入 <a href="#/m/${esc(p.meeting_id)}">${esc(p.meeting_date||'')} ${esc(p.meeting_title||p.meeting_id)}</a>`:p.status==='排入下次會議'?'・等下一場會議建立後自動排入':''}</div>
    ${p.body?`<p>${esc(p.body)}</p>`:''}

      <label class="f">會議種類<select data-ser>${SERIES.map(x=>`<option value="${esc(x.code)}" ${x.code===(p.series||'ER')?'selected':''}>${esc(x.name)}</option>`).join('')}</select></label>
      <label class="f">回覆<input data-rep value="${esc(p.reply||'')}"></label></div>
      <div class="row" style="margin-top:8px"><button class="btn primary" type="button" data-next>排入下次會議</button><button class="btn" type="button" data-upd>更新狀態與回覆</button><span class="muted small">「排入下次會議」會自動找這個會議種類最近一場；還沒建立就等建立時自動帶入</span></div>`:''}
    </div></div>`;

function bindProps(root, list){
  root.querySelectorAll('[data-prop]').forEach(el=>{
    const id = el.dataset.prop;
    el.querySelector('.second').onclick = async () => { try{ const p=await api('second',{prop_id:id}); const i=list.findIndex(x=>x.prop_id===id); list[i]={...list[i],...p}; el.outerHTML=propItem(list[i]); bindProps(root,list); }catch(e){toast(e.message)} };
    const send = async (status) => { const cur = list.find(x=>x.prop_id===id);
      const p={prop_id:id,status,series:el.querySelector('[data-ser]').value,meeting_id:status===cur.status?cur.meeting_id:'',reply:el.querySelector('[data-rep]').value};
      try{ const r = await api('updateProposal',{proposal:p}); const i=list.findIndex(x=>x.prop_id===id); list[i]={...list[i],...p,...(r||{}),series_name:seriesName(p.series)}; el.outerHTML=propItem(list[i]); bindProps(root,list);
        toast(r && r.meeting_id ? `已排入 ${r.meeting_date} ${r.meeting_title}` : status==='排入下次會議' ? '這種會議還沒有下一場，建立後會自動排入' : '已更新提議'); }catch(e){toast(e.message)} };
    const u = el.querySelector('[data-upd]'); if (u) u.onclick = () => send(el.querySelector('[data-st]').value);
    const nx = el.querySelector('[data-next]'); if (nx) nx.onclick = () => send('排入下次會議');
  });
}

/* ===== 決議追蹤 ===== */
function decTable(list, withMeeting, editable){
  if(!list.length) return `<div class="empty">沒有決議事項</div>`;
  return `<div class="tbl"><table><thead><tr>${withMeeting?'<th>會議</th>':''}<th>事項</th><th>負責人</th><th>期限</th><th>狀態</th><th>進度說明</th>${editable?'<th></th>':''}</tr></thead><tbody>
  ${list.map(d=>`<tr class="${isOverdue(d)?'overdue':''}">${withMeeting?`<td style="min-width:130px"><a href="#/m/${esc(d.meeting_id)}">${esc(d.meeting_title||d.meeting_id)}</a><div class="muted small">${esc(String(d.meeting_date||'').slice(0,10))}</div></td>`:''}<td class="item">${esc(d.item)}${d.scope==='相關人員'?' <span class="chip">相關人員</span>':''}</td><td>${esc(d.owner)}</td><td style="white-space:nowrap">${esc(String(d.due||'').slice(0,10))}${isOverdue(d)?`<br><span class="chip hot">逾期 ${daysLate(d)} 天</span>`:''}</td>
  <td>${editable?`<select data-dec="${esc(d.dec_id)}" aria-label="狀態">${STATUS.map(s=>`<option ${s===d.status?'selected':''}>${s}</option>`).join('')}</select>`:statusChip(d.status)}</td><td>${esc(d.note)}</td>
  ${editable?`<td style="white-space:nowrap"><button class="btn sm" type="button" data-dedit="${esc(d.dec_id)}">編輯</button></td>`:''}</tr>`).join('')}</tbody></table></div>`;
}
async function renderDecisions(app){
  const raw = await api('listDecisions');
  let kind = '追蹤', ser = '全部', scope = '全部';
  const base = () => raw.filter(d => (kind==='全部' || (d.kind||'追蹤')===kind) && (ser==='全部' || d.series===ser) && (scope==='全部' || (d.scope||'全體')===scope));
  let all = base();
  let filter = all.some(isOverdue) ? '逾期' : '未完成';
  const match = (d, s) => s==='全部' || (s==='未完成' ? d.status!=='已完成' : s==='逾期' ? isOverdue(d) : d.status===s);
  const FILTERS = ['逾期','未完成','未開始','進行中','持續追蹤','已完成','全部'];
  const draw = () => {
    all = base();
    app.querySelector('.filters').innerHTML = FILTERS.map(s=>`<button type="button" data-f="${s}" aria-pressed="${s===filter}">${s}（${all.filter(d=>match(d,s)).length}）</button>`).join('');
    app.querySelectorAll('.filters button').forEach(b=>b.onclick=()=>{filter=b.dataset.f;draw()});
    const list = all.filter(d => match(d, filter));
    $('#dt').innerHTML = decTable(list, true, isAdmin());
    $('#dt').querySelectorAll('[data-dec]').forEach(sel=>sel.onchange=async()=>{
      const d = all.find(x=>x.dec_id===sel.dataset.dec); d.status = sel.value;
      try{ await api('saveDecision',{decision:d}); toast('已更新狀態'); draw(); }catch(e){ toast(e.message); } });
    $('#dt').querySelectorAll('[data-dedit]').forEach(b=>b.onclick=()=>{
      const d = all.find(x=>x.dec_id===b.dataset.dedit); const tr = b.closest('tr');
      tr.insertAdjacentHTML('afterend', `<tr><td colspan="7"><form class="edit-box stack" style="gap:10px">
        <label class="f">事項<input name="item" required value="${esc(d.item)}"></label>
        <div class="grid2"><label class="f">類型<select name="kind"><option value="追蹤" ${d.kind!=='當場改善'?'selected':''}>需追蹤</option><option value="當場改善" ${d.kind==='當場改善'?'selected':''}>當場已改善</option></select></label>
        <label class="f">相關範圍<select name="scope">${['全體','相關人員'].map(k=>`<option ${(d.scope||'全體')===k?'selected':''}>${k}</option>`).join('')}</select></label></div>
        <div class="grid2"><label class="f">負責人<input name="owner" value="${esc(d.owner||'')}"></label><label class="f">期限<input name="due" type="date" value="${esc(String(d.due||'').slice(0,10))}"></label>
        <label class="f">狀態<select name="status">${STATUS.map(s=>`<option ${s===d.status?'selected':''}>${s}</option>`).join('')}</select></label></div>
        <label class="f">進度說明<input name="note" value="${esc(d.note||'')}"></label>
        <div class="row between"><button class="btn sm danger" type="button" data-del>刪除這項決議</button><div class="row"><button class="btn" type="button" data-cancel>取消</button><button class="btn primary" type="submit">儲存</button></div></div></form></td></tr>`);
      const f = tr.nextElementSibling.querySelector('form'); b.disabled = true;
      f.querySelector('[data-cancel]').onclick = draw;
      f.querySelector('[data-del]').onclick = async () => { if(!confirm('確定刪除這項決議？')) return; try{ await api('deleteDecision',{dec_id:d.dec_id}); raw.splice(raw.indexOf(d),1); toast('已刪除'); draw(); }catch(e){toast(e.message)} };
      f.onsubmit = async e => { e.preventDefault(); const fd = new FormData(f); const n = {...d, item:fd.get('item'), owner:fd.get('owner'), due:fd.get('due'), status:fd.get('status'), note:fd.get('note'), kind:fd.get('kind'), scope:fd.get('scope')};
        try{ await api('saveDecision',{decision:n}); Object.assign(d, n); toast('已更新'); draw(); }catch(err){toast(err.message)} };
    });
  };
  const codes = [...new Set(raw.map(d=>d.series))];
  app.innerHTML = `<div class="stack">${demoBanner()}${pageHead('決議追蹤','各會議決議的執行狀態；每一項都標出來自哪場會議')}
    <div class="row" style="gap:14px">
      <label class="f" for="dk" style="flex-direction:row;align-items:center;gap:6px">類型<select id="dk"><option value="追蹤">需追蹤</option><option value="當場改善">當場已改善</option><option value="全部">全部</option></select></label>
      <label class="f" for="ds" style="flex-direction:row;align-items:center;gap:6px">會議<select id="ds"><option value="全部">全部會議</option>${codes.map(c=>`<option value="${esc(c)}">${esc(seriesName(c))}</option>`).join('')}</select></label>
      <label class="f" for="dsc" style="flex-direction:row;align-items:center;gap:6px">相關範圍<select id="dsc"><option value="全部">全部</option><option value="全體">與全體有關</option><option value="相關人員">相關人員</option></select></label></div>
    <div class="filters"></div>
    <div class="card" id="dt"></div></div>`;
  $('#dk').onchange = e => { kind = e.target.value; filter = '全部'; draw(); };
  $('#ds').onchange = e => { ser = e.target.value; draw(); };
  $('#dsc').onchange = e => { scope = e.target.value; draw(); };
  draw();
}

// 支援帳號中心整列（員編 姓名 類別 職稱 權限 啟用 …）或「員編 姓名 [admin]」
function parseStaffLine(line){
  const t = line.replace(/\r/g,'');
  if (!t.trim()) return null;
  const a = (t.includes('\t') ? t.split('\t') : t.trim().split(/[ ,，]+/)).map(s=>s.trim());
  if (!a[0] || !a[1] || a[0]==='員編') return null;
  if (a.length >= 6) {
    const admin = /account\.admin|meeting\.admin/.test(a[4]||'') || /護理長/.test(a[3]||'');
    return { staff_id:a[0], name:a[1], role: admin?'admin':'rn', status: a[5]==='否' ? '停用' : '在職' };
  }
  return { staff_id:a[0], name:a[1], role: /admin|管理/i.test(a[2]||'') ? 'admin' : 'rn' };
}

/* ===== 會議錄音／影片：同仁上傳 → 瀏覽器轉成小 mp3（影片只留聲音）→ 可多檔合成一個 ===== */
async function loadLame(){
  if (window.lamejs) return;
  try { await loadScript('https://cdnjs.cloudflare.com/ajax/libs/lamejs/1.2.1/lame.min.js'); }
  catch(_) { await loadScript('https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js'); }
  if (!window.lamejs) throw new Error('轉檔工具載入失敗，請檢查網路後再試');
}
/** 把多個錄音／影片檔轉成 16kHz 單聲道 32kbps mp3（約 1 小時 14MB）；merge=true 時依序接成一個檔；超過 22MB 自動分段 */
async function toMp3(files, merge, onp){
  await loadLame();
  const SR = 16000, LIMIT = 22 * 1048576, outs = [];
  let enc = null, cur = [], curSize = 0;
  const start = () => { enc = new lamejs.Mp3Encoder(1, SR, 32); };
  const finish = () => { if (!enc) return; const e = enc.flush(); if (e.length) cur.push(new Uint8Array(e)); if (cur.length) outs.push({blob:new Blob(cur, {type:'audio/mpeg'})}); cur = []; curSize = 0; enc = null; };
  for (let fi = 0; fi < files.length; fi++) {
    const f = files[fi];
    if (f.size > 1.8e9) throw new Error(f.name + ' 超過 1.8GB，請改用錄音檔，或在電腦上先剪短');
    onp(`讀取 ${f.name}…`, fi / files.length);
    let audio;
    try {
      const AC = window.OfflineAudioContext || window.webkitOfflineAudioContext;
      audio = await new AC(1, 1, SR).decodeAudioData(await f.arrayBuffer());
    } catch(e) {
      // 瀏覽器解不開（例如某些手機錄音格式）：小於 22MB 的錄音檔就原檔上傳，AI 一樣讀得懂
      if (/^audio\//.test(f.type) && f.size <= LIMIT) { finish(); outs.push({blob:f, raw:true, name:f.name}); continue; }
      throw new Error(`${f.name} 無法讀取聲音（格式不支援或檔案太大）。建議用手機錄音 App 錄成 m4a／mp3，或在電腦上傳。`);
    }
    const n = audio.length, ch = audio.numberOfChannels, d0 = audio.getChannelData(0);
    for (let c = 1; c < ch; c++) { const d = audio.getChannelData(c); for (let i = 0; i < n; i++) d0[i] += d[i]; }
    if (ch > 1) for (let i = 0; i < n; i++) d0[i] /= ch;
    if (!merge || !enc) { if (!merge) finish(); start(); }
    const BS = 1152 * 50, i16 = new Int16Array(BS);
    for (let i = 0, k = 0; i < n; i += BS, k++) {
      const len = Math.min(BS, n - i);
      for (let j = 0; j < len; j++) { let v = d0[i + j]; v = v < -1 ? -1 : v > 1 ? 1 : v; i16[j] = v < 0 ? v * 0x8000 : v * 0x7fff; }
      const out = enc.encodeBuffer(i16.subarray(0, len));
      if (out.length) { cur.push(new Uint8Array(out)); curSize += out.length; }
      if (curSize > LIMIT) { finish(); start(); }
      if (k % 10 === 0) { onp(`轉換 ${f.name}（${Math.round(i / n * 100)}%）`, (fi + i / n) / files.length); await new Promise(r => setTimeout(r, 0)); }
    }
    audio = null;
  }
  finish();
  return outs;
}

      <div class="muted small">手機上請保持畫面開著直到上傳完成。影片檔很大時（超過 1GB）建議在電腦上傳。</div></div>`:''}
    ${recs.length?`<div class="files">${recs.map((a,i)=>`<div class="file"><span class="att-no">第${i+1}段</span><span class="n">${esc(a.name)}<br><span class="muted small">${esc(a.uploaded_by)}・${esc(a.uploaded_at)}・${mb(a.size)}</span></span>
      ${r.can_edit?`<button class="btn sm" type="button" data-open="${esc(a.att_id)}">試聽</button>`:''}${a.mine||r.can_edit?`<button class="btn sm danger" type="button" data-rdel="${esc(a.att_id)}">刪除</button>`:''}</div>`).join('')}</div>`:''}`;
  box.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openFile(b.dataset.open));
  box.querySelectorAll('[data-rdel]').forEach(b=>b.onclick=async()=>{ if(!confirm('確定刪除這段錄音？')) return; try{ await api('deleteFile',{att_id:b.dataset.rdel}); toast('已刪除'); loadMinutes(id, meeting); }catch(e){toast(e.message)} });
  const go = $('#rec_go'); if (!go) return;
  go.onclick = async () => {
    const files = [...$('#rec_f').files].sort((a,b)=>a.name.localeCompare(b.name, 'zh-Hant', {numeric:true}));
    if (!files.length) return toast('請先選擇檔案');
    const prog = $('#rec_prog'), bar = $('#rec_bar'), msg = $('#rec_msg');
    prog.hidden = false; go.disabled = true; formDirty = true;
    const onp = (t, v) => { msg.textContent = t; bar.value = Math.min(0.95, v * 0.8); };
    try {
      const merge = $('#rec_merge').checked;
      const outs = await toMp3(files, merge, onp);
      const conv = outs.filter(o => !o.raw).length;
      for (let i = 0, k = 0; i < outs.length; i++) {
        const o = outs[i];
        onp(`上傳第 ${i+1}/${outs.length} 個（${(o.blob.size/1048576).toFixed(1)} MB）…`, 0.8 + 0.2 * i / outs.length);
        let name, mime = 'audio/mpeg';
        if (o.raw) { name = o.name; mime = o.blob.type || 'audio/mp4'; }
        else { k++; const base = merge && files.length > 1 ? `會議錄音（${files.length} 檔合成）` : files[Math.min(i, files.length-1)].name.replace(/\.[^.]+$/,''); name = base + (conv > 1 && merge ? `_${k}` : '') + '.mp3'; }
        await api('uploadFile', {meeting_id:id, kind:'會議錄音', name, mime, base64: await fileB64(o.blob)});
      }
      bar.value = 1; msg.textContent = '上傳完成'; toast('錄音已上傳'); formDirty = false; loadMinutes(id, meeting);
    } catch(e) { msg.textContent = e.message; toast(e.message); go.disabled = false; formDirty = false; }
  };
}

/* ===== 會議紀錄：紀錄者整理 → 組長／副組長審核（任一人）→ 護理長核定公開 ===== */
const STEPS = [['draft','紀錄者整理'],['review','組長／副組長審核'],['reviewed','護理長核定'],['published','公開']];
async function loadMinutes(id, meeting){
  const box = $('#minutes'); if (!box) return;
  let r;
  try { r = await api('getMinutes',{meeting_id:id}); } catch(e){ box.innerHTML = `<h2>會議紀錄</h2><div class="muted">${esc(e.message)}</div>`; return; }
  renderRecs(id, meeting, r);
  const mi = r.minutes || {header:{}, body:'', followups:[], status:'draft'};
  const st = mi.status || 'draft';
  const dd = curMeet?.d || {};
  const link = `${SITE()}#/m/${id}`;
  const files = (dd.attachments||[]).filter(a=>a.kind==='會議紀錄');
  const filesHtml = (can) => files.length ? `<div class="files">${files.map(a=>`<div class="file"><span class="chip">紀錄檔</span><span class="n">${esc(a.name)}</span><button class="btn sm" type="button" data-open="${esc(a.att_id)}">開啟</button>${can?`<button class="btn sm danger" type="button" data-fdel="${esc(a.att_id)}">刪除</button>`:''}</div>`).join('')}</div>` : '';
  const shareBar = () => st!=='published' ? '' : `<div class="row"><button class="btn primary" type="button" id="m_share">分享</button></div>`;
  const readBar = () => st!=='published' ? '' : CONFIG.SIGNOFF==='board' ? shareBar()
    : dd.me_read ? `<div class="readbar"><span>✓ 您已簽閱本次會議紀錄</span></div>`
    : dd.me_present ? `<div class="readbar"><span>您已出席本次會議，不需另外簽閱</span></div>`
    : `<div class="readbar"><span>未出席的同仁請閱讀後簽閱（評鑑佐證用）</span><button class="btn primary" type="button" id="mread">我已閱讀，簽閱</button></div>`;
  const bindCommon = () => {
    const sh = $('#m_share'); if (sh) sh.onclick = () => shareLink(`${meeting.title} 會議紀錄`, `${meeting.title}（${meeting.date}）會議紀錄已公開，請點連結閱讀：`, link);
    const b = $('#mread'); if (b) b.onclick = async () => { b.disabled = true;
      try{ await api('confirmRead',{meeting_id:id}); dd.me_read = true; toast('已簽閱，謝謝'); loadMinutes(id, meeting); }catch(e){ toast(e.message); b.disabled=false; } };
    box.querySelectorAll('[data-open]').forEach(x=>x.onclick=()=>openFile(x.dataset.open));
    box.querySelectorAll('[data-fdel]').forEach(x=>x.onclick=async()=>{ if(!confirm('確定刪除這個紀錄檔？')) return; try{ await api('deleteFile',{att_id:x.dataset.fdel}); curMeet.d.attachments = curMeet.d.attachments.filter(a=>a.att_id!==x.dataset.fdel); toast('已刪除'); loadMinutes(id, meeting); }catch(e){toast(e.message)} });
  };
  if (!r.can_edit) {
    box.innerHTML = r.minutes
      ? `<div class="row between"><h2>會議紀錄</h2><div class="row"><button class="btn" type="button" id="mdoc">下載 Word 檔</button><button class="btn" type="button" id="mpdf">下載 PDF</button></div></div>${readBar()}${headTable(mi.header)}<div style="white-space:pre-wrap;color:var(--fg-2)">${esc(mi.body)}</div>${filesHtml(false)}`
      : `<h2>會議紀錄</h2><div class="muted">會議紀錄整理中${r.status?`（目前：${esc((MIN_ST[r.status]||[''])[0])}）`:''}，核定公開後會放在這裡。</div>`;
    const b = $('#mdoc'); if (b) b.onclick = () => downloadDoc(meeting, mi);
    const bp = $('#mpdf'); if (bp) bp.onclick = () => downloadPdf(meeting, mi);
    bindCommon();
    return;
  }
  const canEditNow = r.is_admin || st==='draft' || (st==='review' && r.is_reviewer);
  const lockMsg = canEditNow ? '' : st==='review' ? '紀錄送審中，要修改請審核者退回。' : st==='reviewed' ? '審核已通過，等待護理長核定；要修改請聯絡護理長。' : '紀錄已核定公開，要修改請聯絡護理長。';
  const idx = STEPS.findIndex(x=>x[0]===st);
  const agenda = r.agenda || [];
  const template = agenda.length ? TEMPLATE_BODY.replace(/三、討論事項\n[\s\S]*?\n\n四、/, '三、討論事項\n' + agenda.map((p,i)=>`案由${i+1}.${p.title}（提案人：${p.proposer||''}）\n 說明：${p.body||''}\n 討論：\n 決議：`).join('\n') + '\n\n四、') : TEMPLATE_BODY;
  const nRec = (r.recordings||[]).length + (r.legacy_audio?1:0);
  box.innerHTML = `
    <div class="row between"><h2>會議紀錄</h2><span class="chip ${(MIN_ST[st]||[])[1]||''}">${esc((MIN_ST[st]||['草稿'])[0])}</span></div>
    <ol class="steps">${STEPS.map(([k,t],i)=>`<li class="${i<idx?'done':i===idx?'cur':''}">${t}</li>`).join('')}</ol>
    <div class="muted small">審核者：${r.reviewers.length?esc(r.reviewers.join('、')):'（這種會議還沒設定審核者，送審後直接給護理長）'}${r.group?`（${esc(r.group)}）`:''}　｜　最後核定：護理長</div>
    ${st==='draft'&&mi.review_note?`<div class="banner warnbar">退回意見（${esc(mi.reviewed_by)} ${esc(mi.reviewed_at)}）：${esc(mi.review_note)}</div>`:''}
    ${st==='reviewed'?`<div class="readbar"><span>${esc(mi.reviewed_by)} 已於 ${esc(mi.reviewed_at)} 審核通過${mi.review_note?`：${esc(mi.review_note)}`:''}</span></div>`:''}
    ${lockMsg?`<div class="banner">${lockMsg}</div>`:''}
    <div class="grid2">${HEAD_FIELDS.map(([k,t])=>`<label class="f" for="h_${k}">${t}<input id="h_${k}" value="${esc(mi.header[k]||(k==='time'?meeting.date:''))}" ${canEditNow?'':'disabled'}></label>`).join('')}</div>
    ${canEditNow?`<div class="card stack" style="background:var(--bg)">
      <h2 style="font-size:19px">用 AI 產生紀錄草稿</h2>
      <fieldset class="opts"><legend>① 要用哪些資料？（可複選）</legend>
        <label class="check"><input type="checkbox" id="src_a" ${nRec?'checked':'disabled'}> 會議錄音／影片 ${nRec?`<span class="chip teal">${nRec} 段</span>`:'<span class="muted small">（還沒有人上傳，見上方「會議錄音／影片」）</span>'}</label>
        <label class="check"><input type="checkbox" id="src_t"> 紀錄者筆記</label>
        <textarea id="m_notes" placeholder="手寫或打字的會議重點、討論內容" hidden></textarea>
        <label class="check"><input type="checkbox" id="src_d" ${nRec?'':'checked'}> 會議資料（簡報內容、公告、投票結果、決議、提議、附件）</label>
      </fieldset>
      <fieldset class="opts"><legend>② 紀錄格式</legend>
        <label class="check"><input type="radio" name="m_style" value="full" checked> 完整院方格式（一～七項）</label>
        <label class="check"><input type="radio" name="m_style" value="brief"> 重點摘要（報告重點、決議、追蹤事項）</label>
      </fieldset>
      <div class="row"><button class="btn primary" type="button" id="m_ai">產生紀錄草稿</button><span class="muted small">只勾會議資料時，討論內容會標「〔會中討論待補〕」。一小時錄音約需 1–3 分鐘。</span></div>
    </div>
    <div class="row"><button class="btn sm" type="button" id="m_fill">從簽到名單帶入出席／請假</button></div>`:''}
    <label class="f" for="m_body">紀錄內容${canEditNow?'（可直接編輯或手動輸入）':''}<textarea id="m_body" style="min-height:420px;line-height:1.7" ${canEditNow?'':'readonly'}>${esc(mi.body || template)}</textarea></label>
    <div class="stack" style="gap:8px"><h2 style="font-size:19px">本次會議追蹤事項</h2>
      <div class="muted small" style="margin:0">「需追蹤」核定後會進入決議追蹤；「當場已改善」只留在紀錄，不列入追蹤清單。「相關人員」表示只和特定同仁有關。</div>
      <div id="m_fu" class="stack" style="gap:8px"></div>
      ${canEditNow?'<div><button class="btn" type="button" id="m_addfu">＋ 新增一項</button></div>':''}</div>
    <div class="stack" style="gap:8px"><h2 style="font-size:19px">紀錄者另附紀錄檔（選填）</h2>
      <div class="muted small" style="margin:0">紀錄者若用自己的 Word 檔或照片整理，可上傳在這裡；核定公開後同仁也看得到。</div>
      ${filesHtml(canEditNow)}
      ${canEditNow?`<form class="row" id="mf_up"><input id="mf_f" type="file" accept=".doc,.docx,.pdf,image/*" style="flex:1"><button class="btn" type="submit">上傳紀錄檔</button></form>`:''}</div>
    <div class="row">${canEditNow?`<button class="btn" type="button" id="m_save">儲存</button>`:''}<button class="btn" type="button" id="m_doc">下載 Word 檔</button><button class="btn" type="button" id="m_pdf">下載 PDF</button></div>
    <div class="actbar">
      ${st==='draft'?`<button class="btn primary" type="button" id="m_submit">儲存並送審</button><span class="muted small">送給${r.reviewers.length?esc(r.reviewers.join('／')):'護理長'}</span>`:''}
      ${st==='review'&&r.can_review?`<input id="m_note" placeholder="審核意見（退回時必填）" style="flex:1;min-width:220px"><button class="btn primary" type="button" id="m_pass">審核通過</button><button class="btn danger" type="button" id="m_back">退回修改</button>`:''}
      ${r.is_admin&&st!=='published'?`<button class="btn ${st==='reviewed'?'primary':''}" type="button" id="m_ok">${st==='reviewed'?'核定並公開':'護理長直接核定公開'}</button>`:''}
      ${r.is_admin&&st==='published'?`<button class="btn" type="button" id="m_reopen">退回草稿</button>`:''}
    </div>
    ${readBar()}
    <details class="mgr" id="m_ver"><summary>修改紀錄（每次儲存、送審、審核、核定都會留一版）</summary><div id="m_verlist" class="muted small" style="margin-top:6px">載入中…</div></details>
    ${r.is_admin&&st==='published'&&CONFIG.SIGNOFF!=='board'?'<details class="mgr" id="m_rd"><summary>簽閱情形</summary><div id="m_rdlist" class="muted small" style="margin-top:6px">載入中…</div></details>':''}`;
  bindCommon();
  const fuBox = $('#m_fu');
  const fuRow = (f={}) => { const d=document.createElement('div'); d.className='furow';
    d.innerHTML = `<input type="checkbox" ${f.pick===false?'':'checked'} aria-label="列入" ${canEditNow?'':'disabled'}><input aria-label="事項" value="${esc(f.item||'')}" placeholder="事項" ${canEditNow?'':'disabled'}><input aria-label="負責人" value="${esc(f.owner||'')}" placeholder="負責人" ${canEditNow?'':'disabled'}><input aria-label="期限" type="date" value="${esc(f.due||'')}" ${canEditNow?'':'disabled'}>
      <select aria-label="類型" ${canEditNow?'':'disabled'}>${['追蹤','當場改善'].map(k=>`<option value="${k}" ${(f.kind||'追蹤')===k?'selected':''}>${k==='追蹤'?'需追蹤':'當場已改善'}</option>`).join('')}</select>
      <select aria-label="相關範圍" ${canEditNow?'':'disabled'}>${['全體','相關人員'].map(k=>`<option ${(f.scope||'全體')===k?'selected':''}>${k}</option>`).join('')}</select>`; fuBox.appendChild(d); };
  ((mi.followups||[]).length ? mi.followups : [{}]).forEach(fuRow);
  const af = $('#m_addfu'); if (af) af.onclick = () => fuRow();
  const collect = () => ({
    header: Object.fromEntries(HEAD_FIELDS.map(([k])=>[k,$('#h_'+k).value])),
    body: $('#m_body').value,
    followups: [...fuBox.children].map(r=>{const i=r.querySelectorAll('input,select');return {pick:i[0].checked,item:i[1].value.trim(),owner:i[2].value.trim(),due:i[3].value,kind:i[4].value,scope:i[5].value}}).filter(f=>f.item)
  });
  const busyB = (on, msg) => { box.querySelectorAll('button').forEach(b=>b.disabled=on); if(msg) toast(msg); };
  const reload = () => { formDirty = false; loadMinutes(id, meeting); };
  let restoreOf = '';
  const save = () => api('saveMinutes',{meeting_id:id,minutes:collect(),restore_of:restoreOf||undefined});
  const sv = $('#m_save'); if (sv) sv.onclick = async () => { busyB(true); try{ await save(); toast('已儲存'); reload(); }catch(e){ toast(e.message); busyB(false);} };
  $('#m_doc').onclick = () => downloadDoc(meeting, collect());
  $('#m_pdf').onclick = () => downloadPdf(meeting, collect());
  const srcT = $('#src_t'); if (srcT) srcT.onchange = () => { $('#m_notes').hidden = !srcT.checked; if (srcT.checked) $('#m_notes').focus(); };
  const aiB = $('#m_ai'); if (aiB) aiB.onclick = async () => {
    const sources = { audio: $('#src_a').checked, text: $('#src_t').checked ? $('#m_notes').value.trim() : '', data: $('#src_d').checked };
    if (!sources.audio && !sources.text && !sources.data) return toast($('#src_t').checked ? '請先輸入筆記' : '請至少勾選一種資料');
    if ($('#m_body').value.trim() && $('#m_body').value.trim()!==template.trim() && !confirmReplace()) return;
    busyB(true,'AI 整理中，請稍候…'); try{ await api('summarize',{meeting_id:id,sources,style:document.querySelector('[name=m_style]:checked').value,header:collect().header}); toast('已產生紀錄草稿，請核對'); reload(); }catch(e){ toast(e.message); busyB(false);} };
  const fl = $('#m_fill'); if (fl) fl.onclick = async () => { try { const a = curMeet?.attendance || await api('listAttendance',{meeting_id:id});
      const fmt = s => a.list.filter(x=>x.status===s).map(x=>x.name+(x.title?'（'+x.title+'）':'')).join('、');
      $('#h_attend').value = fmt('出席'); $('#h_leave').value = fmt('請假') || '無'; toast(`已帶入出席 ${a.n_present} 人、請假 ${a.n_leave} 人`); } catch(e){ toast(e.message); } };
  const mf = $('#mf_up'); if (mf) mf.onsubmit = async e => { e.preventDefault(); const f = $('#mf_f').files[0]; if (!f) return toast('請先選擇檔案');
    try{ toast('上傳中…'); const a = await uploadOne(id, '會議紀錄', f); curMeet.d.attachments.push(a); toast('已上傳紀錄檔'); reload(); }catch(err){ toast(err.message); } };
  const sb = $('#m_submit'); if (sb) sb.onclick = async () => { if (!$('#m_body').value.trim()) return toast('紀錄內容是空的');
    busyB(true); try{ await save(); await api('submitMinutes',{meeting_id:id}); toast('已送審'); reload(); }catch(e){ toast(e.message); busyB(false);} };
  const ps = $('#m_pass'); if (ps) ps.onclick = async () => { busyB(true); try{ await save(); await api('reviewMinutes',{meeting_id:id,ok:true,note:$('#m_note').value}); toast('已審核通過，送護理長核定'); reload(); }catch(e){ toast(e.message); busyB(false);} };
  const bk = $('#m_back'); if (bk) bk.onclick = async () => { const note = $('#m_note').value.trim(); if (!note) { $('#m_note').focus(); return toast('請寫退回原因或修改意見'); }
    busyB(true); try{ await save(); await api('reviewMinutes',{meeting_id:id,ok:false,note}); toast('已退回給紀錄者'); reload(); }catch(e){ toast(e.message); busyB(false);} };
  const ok = $('#m_ok'); if (ok) ok.onclick = async () => { if (st!=='reviewed' && !confirm('這份紀錄還沒經過組長／副組長審核，確定直接核定公開？')) return;
    busyB(true); try{ const x=collect(); await api('saveMinutes',{meeting_id:id,minutes:x});
      await api('approveMinutes',{meeting_id:id,add_followups:x.followups.filter(f=>f.pick).map(({pick,...f})=>f)}); toast('已核定並公開'); formDirty=false; render(); }catch(e){ toast(e.message); busyB(false);} };
  const ro = $('#m_reopen'); if (ro) ro.onclick = async () => { if(!confirm('退回草稿後同仁會暫時看不到紀錄，確定嗎？')) return; try{ await api('reopenMinutes',{meeting_id:id}); toast('已退回草稿'); reload(); }catch(e){toast(e.message)} };
  $('#m_ver').addEventListener('toggle', async function(){ if(!this.open) return; const el = $('#m_verlist');
    try{ const vs = await api('listMinutesLog',{meeting_id:id});
      el.innerHTML = vs.length ? vs.map(v=>`<div class="ver"><span style="min-width:130px">${esc(String(v.at).slice(0,16).replace('T',' '))}</span><b>${esc(v.action)}</b><span>${esc(v.by)}</span>${v.size?`<button class="btn sm" type="button" data-ver="${esc(v.log_id)}">查看</button>`:''}</div>`).join('') : '還沒有修改紀錄';
      el.querySelectorAll('[data-ver]').forEach(b=>b.onclick=async()=>{ try{ const v = await api('getMinutesVersion',{log_id:b.dataset.ver});
        const old = el.querySelector('.verview'); if (old) old.remove();
        b.closest('.ver').insertAdjacentHTML('afterend', `<div class="verview edit-box stack" style="gap:8px"><div class="row between"><b>${esc(String(v.at).slice(0,16).replace('T',' '))}　${esc(v.action)}（${esc(v.by)}）</b>${canEditNow?'<button class="btn sm" type="button" data-restore>放回編輯區</button>':''}</div><div style="white-space:pre-wrap;max-height:360px;overflow:auto;color:var(--fg-2)">${esc(v.body)}</div></div>`);
        const rs = el.querySelector('[data-restore]'); if (rs) rs.onclick = () => { $('#m_body').value = v.body; HEAD_FIELDS.forEach(([k])=>{ if(v.header[k]!=null) $('#h_'+k).value=v.header[k]; }); restoreOf = String(v.at).slice(0,16).replace('T',' '); formDirty = true; toast('已放回編輯區，按「儲存」才會生效'); $('#m_body').scrollIntoView({block:'center'}); };
      }catch(e){toast(e.message)} });
    }catch(e){ el.textContent = e.message; } });
  const rd = $('#m_rd'); if (rd) rd.addEventListener('toggle', async function(){ if(!this.open) return; const el = $('#m_rdlist');
    try{ const r2 = await api('listReads',{meeting_id:id});

const FILE_ACCEPT = '.html,.htm,.pdf,image/*,.doc,.docx,.xls,.xlsx,.ppt,.pptx';
const MIME_BY_EXT = {html:'text/html',htm:'text/html',pdf:'application/pdf',doc:'application/msword',xls:'application/vnd.ms-excel',ppt:'application/vnd.ms-powerpoint',
  docx:'application/vnd.openxmlformats-officedocument.wordprocessingml.document',xlsx:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',pptx:'application/vnd.openxmlformats-officedocument.presentationml.presentation'};
async function uploadOne(mid, kind, f){
  if (f.size > 25*1048576) throw new Error('檔案超過 25MB');
  const ext = (f.name.split('.').pop()||'').toLowerCase();
  const mime = MIME_BY_EXT[ext] || f.type || '';
  return api('uploadFile',{meeting_id:mid, kind, name: /^html?$/.test(ext) ? f.name.replace(/\.html?$/i,'') : f.name, mime, base64: await fileB64(f)});
}

    <div class="files">${list.map(a=>`<div class="file"><span class="att-no">${a.no}</span><span class="chip">${esc(a.kind||'附件')}</span><span class="n">${esc(a.name)}${a.url?`<br><span class="muted small">${esc(a.url)}</span>`:''}</span>

    ${can?`<div class="addbox stack" style="gap:10px">

function beep(ok){ try{ const c=new (window.AudioContext||window.webkitAudioContext)(); const o=c.createOscillator(); const g=c.createGain(); o.frequency.value=ok?880:220; g.gain.value=.08; o.connect(g); g.connect(c.destination); o.start(); o.stop(c.currentTime+(ok?.12:.3)); }catch(_){} }
function loadScript(src){ return new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=rej; document.head.appendChild(s); }); }

  let status = '出席';
  app.innerHTML = `<div class="stack">${demoBanner()}<div><a href="#/m/${esc(id)}">← 回會議</a></div>
    ${pageHead('現場簽到', esc(m.title), `<span class="chip teal" id="k_cnt"></span>`)}
    <div class="card kiosk">
      <div class="filters" role="group" aria-label="簽到狀態">${['出席','請假'].map(s=>`<button type="button" data-s="${s}" aria-pressed="${s===status}">${s}</button>`).join('')}</div>
      <form id="kf"><label class="f" for="k_in">刷員工證、掃條碼，或輸入員編後按 Enter<input id="k_in" class="kin" autocomplete="off" autocorrect="off" spellcheck="false" inputmode="numeric" enterkeyhint="done"></label></form>
      <div id="k_msg" class="kmsg" role="status" aria-live="polite">等待刷卡…</div>
      <div class="row" style="justify-content:center"><button class="btn" type="button" id="k_cam">用手機相機掃條碼</button><button class="btn" type="button" id="k_nm">沒有員編，輸入姓名</button></div>
      <div id="k_reader"></div>
      <div class="muted small">USB 條碼槍、讀卡機會自動把號碼打進上面的框；手機請按「用手機相機掃條碼」。同一人重複刷不會重複計算。</div>
    </div>
    <section class="card"><h2 style="margin-bottom:10px">已簽到</h2><div id="k_list"></div></section></div>`;
  const inp = $('#k_in'), msg = $('#k_msg');
  const show = (cls, t) => { msg.className = 'kmsg ' + cls; msg.textContent = t; };
  const drawList = a => { $('#k_cnt').textContent = `出席 ${a.n_present}・請假 ${a.n_leave}`;
    $('#k_list').innerHTML = a.list.length ? `<div class="alist">${[...a.list].reverse().map(p=>`<div class="p ${p.status==='請假'?'leave':''}"><span class="n">${esc(p.name||p.staff_id)}</span><span class="muted small">${p.status==='請假'?'請假':esc(p.time)}・${esc(p.method)}</span></div>`).join('')}</div>` : '<div class="empty">還沒有人簽到</div>'; };
  drawList(await api('listAttendance',{meeting_id:id}));
  let last = {code:'', t:0};
  const submit = async (code, method) => {
    code = String(code||'').trim(); if (!code) return;
    if (code===last.code && Date.now()-last.t < 3000) return; last = {code, t:Date.now()};
    show('', '查詢中…');
    try { const r = await api('checkin',{meeting_id:id, staff_id:code, status, method});
      beep(true); show(r.already?'warn':'ok', r.already ? `${r.name||code} 已經簽到過` : `✓ ${r.name||code}${r.title?'（'+r.title+'）':''}　${status}`);
      drawList(await api('listAttendance',{meeting_id:id})); }
    catch(e){ beep(false); show('bad', e.message); }
  };
  $('#kf').onsubmit = e => { e.preventDefault(); const v = inp.value; inp.value=''; submit(v, '刷卡／輸入員編'); };
  app.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{ status=b.dataset.s; app.querySelectorAll('[data-s]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.s===status)); inp.focus(); });
  $('#k_nm').onclick = async () => { const n = prompt('輸入姓名（沒有員編的人員，例如外單位）'); if(!n) return;
    try{ await api('checkin',{meeting_id:id,name:n.trim(),status,method:'手動輸入'}); beep(true); show('ok', `✓ ${n.trim()}　${status}`); drawList(await api('listAttendance',{meeting_id:id})); }catch(e){ beep(false); show('bad', e.message); } };
  $('#k_cam').onclick = async () => {
    if (scanner) { stopScanner(); $('#k_reader').innerHTML=''; $('#k_cam').textContent='用手機相機掃條碼'; return; }
    try { if (!window.Html5Qrcode) { try { await loadScript('https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js'); } catch(_) { await loadScript('https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js'); } }
      const F = window.Html5QrcodeSupportedFormats;
      scanner = new Html5Qrcode('k_reader', {formatsToSupport:[F.CODE_128,F.CODE_39,F.CODE_93,F.CODABAR,F.EAN_13,F.ITF,F.QR_CODE], verbose:false});
      await scanner.start({facingMode:'environment'}, {fps:10, qrbox:{width:280,height:130}, experimentalFeatures:{useBarCodeDetectorIfSupported:true}}, t=>submit(t,'掃條碼'), ()=>{});
      $('#k_cam').textContent='關閉相機'; show('', '對準員工證條碼…');
    } catch(e){ stopScanner(); show('bad', '無法開啟相機：請允許相機權限，或改用刷卡／輸入員編'); }
  };
  document.addEventListener('click', function keep(e){ if (!document.body.contains(inp)) return document.removeEventListener('click', keep); if (!scanner && !e.target.closest('button,a,input,select,label')) inp.focus(); });
  inp.focus();
}

/* ===== 會議現場（同仁掃 QR 進來：簽到＋投票） ===== */
async function renderLive(app, id){
  const [d, a] = await apiBatch([['getMeeting',{meeting_id:id}],['listAttendance',{meeting_id:id}]]);
  const m = d.meeting; const open = d.polls.filter(p=>p.open);
  app.innerHTML = `<div class="stack bigpoll">${demoBanner()}
    <section class="card hero"><div><div class="eyebrow">會議現場</div><h1>${esc(m.title)}</h1><div class="meta">${esc(m.date)}　｜　${esc(session.name)}</div></div></section>
    <section class="card stack"><h2>簽到</h2>${a.me?`<div class="kmsg ok">✓ 您已簽到（${esc(a.me)}）</div>`: a.today||a.can_edit ? `<button class="btn primary big" type="button" id="selfIn">我已到場，簽到</button>` : `<div class="muted">會議當天（${esc(m.date)}）才能自行簽到</div>`}</section>
    ${open.length ? open.map(p=>pollCard(p)).join('') : '<div class="card empty">目前沒有進行中的投票</div>'}
    <div><a href="#/m/${esc(id)}">查看完整會議資料 →</a></div></div>`;
  const si = $('#selfIn'); if (si) si.onclick = async () => { si.disabled=true; try{ await api('checkin',{meeting_id:id}); toast('簽到完成'); renderLive(app, id); }catch(e){ toast(e.message); si.disabled=false; } };
  bindPolls(app);
}
async function renderVote(app, pid){
  const p = (await api('listPolls')).find(x=>x.poll_id===pid);
  if (!p) { app.innerHTML = '<div class="card">找不到這個投票，可能尚未公開或已刪除。</div>'; return; }
  app.innerHTML = `<div class="stack bigpoll">${demoBanner()}${pollCard(p)}<div><a href="#/polls">全部投票 →</a></div></div>`;
  bindPolls(app);
}

/* ===== 檔案檢視：登入後才從後端取檔，不公開雲端硬碟連結 ===== */
const REPORT_PRINT_CSS = `@page{size:1920px 1080px;margin:0}
html,body{height:auto!important;overflow:visible!important;background:#fff!important}
#bar,#notes,#help{display:none!important}
#viewport{position:static!important;display:block!important}
#deck{transform:none!important;width:1920px!important;height:auto!important;position:static!important}
#deck>section{position:relative!important;inset:auto!important;opacity:1!important;visibility:visible!important;transform:none!important;box-shadow:none!important;transition:none!important;break-after:page;page-break-after:always}
#deck [data-build-in]{opacity:1!important;transform:none!important;transition:none!important}
*{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}`;
/** 產生 PDF：在隱藏框架開啟列印視窗，選「另存為 PDF」（手機選「分享 › 儲存為 PDF」） */
function printDoc(html, css){
  toast('列印視窗開啟後，目的地選「另存為 PDF」');
  const fr = document.createElement('iframe');
  fr.setAttribute('sandbox','allow-scripts allow-modals'); fr.title = '列印';
  fr.style.cssText = 'position:fixed;right:0;bottom:0;width:1200px;height:800px;border:0;opacity:0;pointer-events:none';
  const inj = `<style>${css||''}@media print{*{-webkit-print-color-adjust:exact;print-color-adjust:exact}}</style><script>addEventListener('load',function(){setTimeout(function(){print()},900)})<\/script>`;
  fr.srcdoc = /<\/head>/i.test(html) ? html.replace(/<\/head>/i, inj + '</head>') : '<!doctype html><html><head><meta charset="utf-8">' + inj + '</head><body>' + html + '</body></html>';
  document.body.appendChild(fr); setTimeout(() => fr.remove(), 180000);
}
function saveBlob(blob, name){ const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href), 60000); }
/** 外部網址轉成可在網站內顯示的版本：Google 雲端硬碟／文件／簡報／試算表用 preview，並提供下載與 PDF 匯出 */
function linkInfo(u){
  let m;
  if ((m = /docs\.google\.com\/(document|presentation|spreadsheets)\/d\/([\w-]+)/.exec(u))) {
    const t = m[1], id = m[2];
    return { embed:`https://docs.google.com/${t}/d/${id}/preview`, pdf: t==='presentation' ? `https://docs.google.com/presentation/d/${id}/export/pdf` : `https://docs.google.com/${t}/d/${id}/export?format=pdf`, google:true };
  }
  if (/drive\.google\.com/.test(u) && (m = /\/file\/d\/([\w-]+)/.exec(u) || /[?&]id=([\w-]+)/.exec(u)))
    return { embed:`https://drive.google.com/file/d/${m[1]}/preview`, dl:`https://drive.google.com/uc?export=download&id=${m[1]}`, google:true };
  if (/\.pdf(\?|#|$)/i.test(u)) return { embed:u, dl:u, pdf:u };
  return { embed:u };
}
function viewerSetup(title, opts){
  const v=$('#viewer'); v.hidden=false; $('#vtitle').textContent = title;
  const set = (id, fn) => { const b=$(id); b.hidden = !fn; if (fn) b.onclick = fn; };
  set('#vdl', opts.dl); set('#vpdf', opts.pdf);
  const ext = $('#vext'); ext.hidden = !opts.ext; if (opts.ext) ext.href = opts.ext;
  const n = $('#vnote'); n.hidden = !opts.note; n.textContent = opts.note || '';
}
async function openFile(id){
  const att = (curMeet?.d.attachments||[]).find(a=>a.att_id===id);
  const body=$('#vbody');
  if (att && att.url) {
    const L = linkInfo(att.url);
    viewerSetup(att.name, { ext: att.url, dl: L.dl ? ()=>window.open(L.dl,'_blank','noopener') : null, pdf: L.pdf ? ()=>window.open(L.pdf,'_blank','noopener') : null,
      note: L.google ? '雲端硬碟檔案需用有權限的 Google 帳號登入才看得到；看不到請按「新分頁開啟」。' : '有些網站不允許嵌入顯示，空白的話請按「新分頁開啟」。' });
    const fr = document.createElement('iframe'); fr.src = L.embed; fr.title = att.name; fr.setAttribute('allow','fullscreen'); fr.setAttribute('allowfullscreen','');
    fr.setAttribute('referrerpolicy','no-referrer'); body.replaceChildren(fr); return;
  }
  viewerSetup(att?.name || '載入中…', {});
  body.innerHTML=`<div class="empty" style="color:#bbb;flex:1">載入中…（第一次開啟較久${/\.(pptx?|docx?|xlsx?)$/i.test(att?.name||'')?'，PowerPoint／Word 第一次要轉成 PDF，約 10–30 秒':''}）</div>`;
  try{
    const f = await api('getFile',{att_id:id});
    if (f.url) { $('#viewer').hidden=true; return window.open(f.url,'_blank','noopener'); }
    const bytes = () => Uint8Array.from(atob(f.base64), c=>c.charCodeAt(0));
    let html = f.text;
    if (!html && f.mime==='text/html') html = new TextDecoder().decode(bytes());
    if (/^audio\//.test(f.mime)) {
      const blob = new Blob([bytes()],{type:f.mime});
      viewerSetup(f.name, { dl: ()=>saveBlob(blob, f.name) });
      const au = Object.assign(document.createElement('audio'), {controls:true, src:URL.createObjectURL(blob)}); body.replaceChildren(au); return;
    }
    if (!/^(text\/html|application\/pdf|image\/)/.test(f.mime)) { $('#viewer').hidden=true; saveBlob(new Blob([bytes()],{type:f.mime}), f.name); return toast('已下載 '+f.name+'（這個檔案無法轉成 PDF，只能下載）'); }
    if (f.mime==='text/html'){
      viewerSetup(f.name, { dl: ()=>saveBlob(new Blob([html],{type:'text/html'}), f.name.replace(/\.html?$/i,'')+'.html'), pdf: ()=>printDoc(html, REPORT_PRINT_CSS) });
      const fr=document.createElement('iframe'); fr.setAttribute('sandbox','allow-scripts'); fr.setAttribute('allow','fullscreen'); fr.setAttribute('allowfullscreen',''); fr.title=f.name; fr.srcdoc=html; body.replaceChildren(fr); setTimeout(()=>fr.focus(),300);
    } else {
      const blob = new Blob([bytes()],{type:f.mime}); const url = URL.createObjectURL(blob);
      const isImg = f.mime.startsWith('image/');
      const dlOrig = f.converted ? async () => { try { toast('下載原檔中…'); const o = await api('getFile',{att_id:id, original:true}); saveBlob(new Blob([Uint8Array.from(atob(o.base64),c=>c.charCodeAt(0))],{type:o.mime}), o.name); } catch(e){ toast(e.message); } } : ()=>saveBlob(blob, f.name);
      viewerSetup(f.name, { dl: dlOrig, pdf: isImg ? ()=>printDoc(`<img src="data:${f.mime};base64,${f.base64}" style="max-width:100%">`, '@page{margin:10mm}') : ()=>saveBlob(blob, /\.pdf$/i.test(f.name)?f.name:f.name+'.pdf'),
        note: f.converted ? `原檔是 ${f.orig_name}，網站內顯示自動轉好的 PDF；按「下載」可取得原檔。` : '' });
      const el = isImg ? Object.assign(document.createElement('img'),{src:url,alt:f.name}) : Object.assign(document.createElement('iframe'),{src:url,title:f.name});
      body.replaceChildren(el);
    }
  }catch(e){ body.innerHTML=`<div class="empty" style="color:#ddd;flex:1">${esc(e.message)}</div>`; }
}
$('#vclose').onclick=()=>{ $('#viewer').hidden=true; $('#vbody').innerHTML=''; };
$('#vfs').onclick=()=>{ try{ document.fullscreenElement?document.exitFullscreen():$('#viewer').requestFullscreen().catch(()=>{}); }catch(_){} };
addEventListener('keydown',e=>{ if(e.key==='Escape' && !$('#qrModal').hidden) $('#qrClose').click(); if(e.key==='Escape' && !$('#viewer').hidden && !document.fullscreenElement) $('#vclose').click(); });
