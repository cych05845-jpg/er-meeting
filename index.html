<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>急診會議整合平台</title>
<meta name="claude:viewport-fit-sides" content="cover">
<script src="/account/edauth.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
/* Layout: 頂部品牌列＋分頁列；首頁為「本月會議」主卡＋公告／投票／提議／決議四區；其他分頁單欄。最寬 1180px。 */
:root{
  --bg:#F7F4EF; --surface:#FFFFFE; --line:#E6DED4; --fg:#1F3A3E; --fg-2:#4D5C5A; --fg-3:#7D8784;
  --accent:#CF4A3A; --accent-soft:#FBE3DD; --ink:#1E5A64; --ink-2:#2A7380; --ink-fg:#F6F8F7; --ink-mute:#CFE6E8;
  --ok:#2878C0; --ok-soft:#DFECF8; --warn:#A8640F; --warn-soft:#F8E8CF; --teal:#1F7A6E; --teal-soft:#DDF0EC;
  --f:"Microsoft JhengHei","微軟正黑體","PingFang TC","Noto Sans TC",sans-serif;
  --r:16px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121A1C; --surface:#1A2527; --line:#2C3A3C; --fg:#E8EEEC; --fg-2:#B9C6C3; --fg-3:#8A9895;
  --accent:#F08A7C; --accent-soft:#3D2420; --ink:#174850; --ink-2:#1F5C66; --ink-fg:#EEF5F4; --ink-mute:#AFCFD3;
  --ok:#8DBDEB; --ok-soft:#1B2C3C; --warn:#E8B867; --warn-soft:#352915; --teal:#7FD1C2; --teal-soft:#16302C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121A1C; --surface:#1A2527; --line:#2C3A3C; --fg:#E8EEEC; --fg-2:#B9C6C3; --fg-3:#8A9895;
  --accent:#F08A7C; --accent-soft:#3D2420; --ink:#174850; --ink-2:#1F5C66; --ink-fg:#EEF5F4; --ink-mute:#AFCFD3;
  --ok:#8DBDEB; --ok-soft:#1B2C3C; --warn:#E8B867; --warn-soft:#352915; --teal:#7FD1C2; --teal-soft:#16302C; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--f);font-size:16px;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--ink)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--ink-2)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--ink);color:var(--ink-fg);box-shadow:0 2px 12px rgba(0,0,0,.08)}
.hrow{display:flex;align-items:center;gap:16px;min-height:56px;padding-block:6px}
.brand{display:flex;align-items:center;gap:12px;font-weight:700;font-size:19px;letter-spacing:.03em;flex:1;min-width:0}
.brand .mark{width:34px;height:34px;border-radius:10px;background:var(--accent);display:grid;place-items:center;flex:none}
.brand small{display:block;font-weight:400;font-size:12px;letter-spacing:.14em;color:var(--ink-mute)}
.who{font-size:14px;display:flex;gap:10px;align-items:center;color:var(--ink-mute)}
.who button{background:transparent;border:1px solid rgba(255,255,255,.3);color:var(--ink-fg);border-radius:999px;padding:3px 12px;cursor:pointer}
nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin-bottom:-1px}
nav::-webkit-scrollbar{display:none}
nav a{color:var(--ink-mute);text-decoration:none;padding:9px 14px 11px;white-space:nowrap;border-bottom:3px solid transparent;display:flex;gap:6px;align-items:center}
nav a:hover{color:var(--ink-fg)}
nav a[aria-current="page"]{color:var(--ink-fg);border-bottom-color:var(--accent);font-weight:700}
nav .badge{background:var(--accent);color:#fff;border-radius:999px;font-size:11px;padding:0 6px;line-height:17px;font-weight:700}
main{padding-block:26px 72px}
h1{font-size:28px;line-height:1.3;margin:0;text-wrap:balance}
h2{font-size:19px;margin:0;line-height:1.35}
h3{font-size:16px;margin:0}
.eyebrow{font-size:12.5px;letter-spacing:.16em;color:var(--accent);font-weight:700}
.muted{color:var(--fg-3)}
.small{font-size:14px}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;min-width:0}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:12px}
.sec-head a{font-size:14px;text-decoration:none}
.banner{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 14px;font-size:14px}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
/* 首頁 */
.hero{background:var(--ink);color:var(--ink-fg);border:none;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:center;padding:26px 28px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:240px;height:240px;border-radius:50%;border:28px solid rgba(255,255,255,.06);pointer-events:none}
.hero .eyebrow{color:#FFB59C}
.hero h1{font-size:30px}
.hero .meta{color:var(--ink-mute);font-size:15px}
.hero .facts{display:flex;gap:22px;flex-wrap:wrap;margin-top:14px}
.hero .facts div{display:flex;flex-direction:column}
.hero .facts b{font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums}
.hero .facts span{font-size:13px;color:var(--ink-mute)}
.dash{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px}
@media (max-width:860px){.dash{grid-template-columns:1fr}.hero{grid-template-columns:1fr}}
/* 公告 */
.ann{display:grid;grid-template-columns:58px minmax(0,1fr);gap:14px;padding:14px 0;border-top:1px solid var(--line)}
.ann:first-child{border-top:none;padding-top:2px}
.date{width:58px;border-radius:10px;overflow:hidden;text-align:center;border:1px solid var(--line);background:var(--surface);align-self:start}
.date .m{background:var(--accent);color:#fff;font-size:11.5px;font-weight:700;letter-spacing:.06em;padding:2px 0}
.date .d{font-size:22px;font-weight:700;line-height:1.35;font-variant-numeric:tabular-nums}
.date .w{font-size:11px;color:var(--fg-3);padding-bottom:3px}
.date.none .m{background:var(--fg-3)}
.ann h3{font-size:16.5px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ann p{margin:3px 0 0;color:var(--fg-2);font-size:15px;white-space:pre-wrap}
.pin{font-size:12px;color:var(--accent);font-weight:700}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:12.5px;padding:1px 9px;border-radius:999px;background:var(--bg);color:var(--fg-2);border:1px solid var(--line);white-space:nowrap;font-weight:500}
.chip.hot{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.chip.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.teal{background:var(--teal-soft);color:var(--teal);border-color:transparent}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 14px;cursor:pointer;font-size:14.5px}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--ink-fg);border-color:var(--ink)}
/* 按鈕與表單 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 16px;cursor:pointer;text-decoration:none;color:var(--fg);font-size:15px}
.btn:hover{border-color:var(--ink-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.light{background:var(--ink-fg);border-color:var(--ink-fg);color:var(--ink)}
.btn.big{padding:12px 22px;font-size:16.5px;font-weight:700}
.btn[disabled]{opacity:.55;cursor:default}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--fg-2);min-width:0}
input,select,textarea{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px;width:100%}
textarea{min-height:90px;resize:vertical}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.check{display:flex;gap:8px;align-items:center;font-size:14.5px;color:var(--fg-2)}
.check input{width:auto}
/* 會議列表 */
.year{font-size:13px;color:var(--fg-3);letter-spacing:.14em;font-weight:700;margin-top:6px}
.mlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.mcard{display:flex;flex-direction:column;gap:8px;text-decoration:none;color:inherit;transition:border-color .15s,transform .15s}
.mcard:hover{border-color:var(--ink-2);transform:translateY(-2px)}
.mcard .mon{font-size:32px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.mcard .mon span{font-size:14px;color:var(--fg-3);font-weight:400;margin-left:6px}
.mcard p{margin:0;color:var(--fg-2);font-size:14.5px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.report-hero{display:flex;gap:20px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--ink);color:var(--ink-fg);border:none}
.report-hero .t{font-size:19px;font-weight:700}
.report-hero .muted{color:var(--ink-mute)}
.files .file{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.files .file:first-child{border-top:none}
.file .n{flex:1;min-width:0;overflow-wrap:anywhere}
/* 表格 */
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{text-align:left;padding:10px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12.5px;color:var(--fg-3);font-weight:700;letter-spacing:.06em;white-space:nowrap}
td.item{min-width:220px}
/* 投票 */
.poll .opt{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.bar{position:relative;height:40px;border-radius:10px;background:var(--bg);overflow:hidden;display:flex;align-items:center;padding:0 12px;border:1px solid var(--line)}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--accent-soft);transition:width .6s ease}
.bar>span{position:relative;display:flex;justify-content:space-between;width:100%;font-variant-numeric:tabular-nums;gap:10px}
.bar>span>b{white-space:nowrap}
.bar.win span b{color:var(--accent)}
.vote-btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.vote-btns .btn{flex:1;min-width:120px;padding:12px 16px;font-weight:700}
/* 提議 */
.prop{display:grid;grid-template-columns:64px minmax(0,1fr);gap:14px;padding:16px 0;border-top:1px solid var(--line)}
.prop:first-child{border-top:none;padding-top:2px}
.second{display:flex;flex-direction:column;align-items:center;gap:2px;border:1px solid var(--line);border-radius:12px;padding:8px 0;background:var(--surface);cursor:pointer;align-self:start;width:64px}
.second b{font-size:20px;line-height:1;font-variant-numeric:tabular-nums}
.second span{font-size:12px;color:var(--fg-3)}
.second[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.second[aria-pressed="true"] b,.second[aria-pressed="true"] span{color:var(--accent)}
.prop p{margin:4px 0 0;color:var(--fg-2);font-size:15px;white-space:pre-wrap}
.reply{margin-top:8px;background:var(--bg);border-radius:10px;padding:8px 12px;font-size:14.5px;color:var(--fg-2)}
.reply b{color:var(--ink-2)}
.statbar{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.statbar div{background:var(--bg);border-radius:10px;padding:10px 12px}
.statbar b{display:block;font-size:24px;line-height:1.1;font-variant-numeric:tabular-nums}
.statbar span{font-size:13px;color:var(--fg-3)}
.login{max-width:400px;margin:7vh auto 0}
.err{color:var(--accent);font-size:14px;min-height:1.4em}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--ink-fg);padding:10px 18px;border-radius:999px;z-index:30;font-size:15px;box-shadow:0 6px 20px rgba(0,0,0,.2)}
#viewer{position:fixed;inset:0;z-index:40;background:#0e1516;display:flex;flex-direction:column}
#viewer .vbar{display:flex;align-items:center;gap:12px;padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));color:#E8EEEC;margin-top:env(safe-area-inset-top,0px)}
#viewer .vbar b{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#viewer .vbar button{background:transparent;color:#E8EEEC;border:1px solid #3b4b4c;border-radius:999px;padding:5px 14px;cursor:pointer}
#viewer iframe,#viewer img{flex:1;width:100%;border:0;background:#2b3538;object-fit:contain;min-height:0}
.learn{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:center}
.qrbox{background:#fff;padding:10px;border-radius:12px;border:1px solid var(--line);line-height:0;width:max-content}
.qrbox img,.qrbox canvas{display:block}
.hbtn{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:var(--ink-fg);border-radius:999px;padding:4px 12px;cursor:pointer;font-size:14px;white-space:nowrap}
#qrModal{position:fixed;inset:0;z-index:45;background:rgba(10,20,22,.82);display:flex;align-items:center;justify-content:center;padding:16px}
#qrModal .panel{background:var(--surface);color:var(--fg);border-radius:20px;padding:28px;max-width:min(560px,100%);width:100%;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
#qrModal .qrbox{padding:16px}
#qrModal .url{font-size:15px;color:var(--fg-2);overflow-wrap:anywhere}
.empty{padding:22px;text-align:center;color:var(--fg-3)}
.btn.sm{padding:3px 12px;font-size:13.5px}
#busy{position:fixed;left:0;top:0;height:3px;width:100%;z-index:60;pointer-events:none;background:linear-gradient(90deg,transparent,var(--accent),transparent);background-size:40% 100%;background-repeat:no-repeat;animation:busy 1s linear infinite}
@keyframes busy{from{background-position:-40% 0}to{background-position:140% 0}}
@media (prefers-reduced-motion:reduce){#busy{animation:none;background:var(--accent);opacity:.6}}
#viewer .vbar a{color:#E8EEEC;border:1px solid #3b4b4c;border-radius:999px;padding:5px 14px;text-decoration:none;font-size:14px;white-space:nowrap}
#viewer .vbar button{white-space:nowrap}
#viewer .vnote{color:#9fb1b0;font-size:13px;padding:4px 16px 8px}
@media (max-width:640px){#viewer .vbar{flex-wrap:wrap}#viewer .vbar b{flex-basis:100%}}
.btn.danger{color:var(--accent);border-color:var(--accent-soft)}
.edit-box{background:var(--bg);border-radius:12px;padding:12px 14px;margin-top:8px}
details.mgr{margin-top:12px;border-top:1px dashed var(--line);padding-top:8px}
details.mgr summary{cursor:pointer;color:var(--fg-3);font-size:14px}
tr.overdue td{background:var(--accent-soft)}
.ver{display:flex;gap:10px;align-items:center;padding:6px 0;border-top:1px solid var(--line);font-size:14.5px;flex-wrap:wrap}
.ver:first-child{border-top:none}
.readbar{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--ok-soft);color:var(--ok);border-radius:12px;padding:12px 16px}
.att-no{font-weight:700;color:var(--ink-2);white-space:nowrap}
.addbox{background:var(--bg);border-radius:12px;padding:12px 14px}
.kiosk{display:flex;flex-direction:column;gap:14px}
.kin{font-size:34px;padding:14px 18px;text-align:center;letter-spacing:.12em;font-variant-numeric:tabular-nums;border-width:2px;border-color:var(--ink-2)}
.kmsg{min-height:78px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:700;text-align:center;padding:12px;background:var(--bg);color:var(--fg-3)}
.kmsg.ok{background:var(--teal-soft);color:var(--teal)}
.kmsg.bad{background:var(--accent-soft);color:var(--accent)}
.kmsg.warn{background:var(--warn-soft);color:var(--warn)}
#k_reader{max-width:420px;width:100%;margin:0 auto;border-radius:12px;overflow:hidden}
.alist{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.alist .p{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:14.5px;min-width:0}
.alist .p .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.alist .p.leave{background:var(--bg);color:var(--fg-3)}
.alist .p button{border:none;background:none;color:var(--fg-3);cursor:pointer;padding:0 2px;font-size:16px}
.bigpoll .poll h2{font-size:24px}
.bigpoll .vote-btns .btn{font-size:20px;padding:18px}
@media (max-width:560px){.statbar{grid-template-columns:repeat(2,minmax(0,1fr))}.hero h1{font-size:25px}.who span{display:none}}
@media (prefers-reduced-motion:reduce){.mcard,.bar i{transition:none}}
</style>
</head>
<body>
<header><div class="wrap">
  <div class="hrow">
    <div class="brand"><span class="mark" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24"><path fill="#fff" d="M9.5 3h5v6.5H21v5h-6.5V21h-5v-6.5H3v-5h6.5z"/></svg></span>
      <span>急診會議整合平台<small>ER MEETING HUB</small></span></div>
    <button type="button" class="hbtn" id="learnBtn" aria-haspopup="dialog">ER-Learn QR</button>
    <div class="who" id="who"></div>
  </div>
  <nav id="nav" aria-label="主選單"></nav>
</div></header>
<main class="wrap" id="app"></main>
<div id="qrModal" hidden role="dialog" aria-modal="true" aria-labelledby="qrTitle">
  <div class="panel"><div class="eyebrow" id="qrEye">教學資源</div><h1 id="qrTitle" style="font-size:26px">ER-Learn 急診學習網</h1>
    <p class="muted" style="margin:0" id="qrDesc">用手機相機掃描即可開啟，適合課堂與示範時投影</p>
    <div class="qrbox" id="qrBig"></div>
    <div class="url" id="qrUrl"></div>
    <div class="row" style="justify-content:center"><a class="btn primary" id="qrOpen" target="_blank" rel="noopener">開啟網站</a><button class="btn" type="button" id="qrCopy">複製連結</button><button class="btn" type="button" id="qrFs">全螢幕投影</button><button class="btn" type="button" id="qrClose">關閉</button></div>
  </div></div>
<div id="busy" hidden></div>
<div id="viewer" hidden>
  <div class="vbar"><b id="vtitle"></b><button type="button" id="vdl" hidden>下載</button><button type="button" id="vpdf" hidden>下載 PDF</button><a id="vext" target="_blank" rel="noopener" hidden>新分頁開啟</a><button type="button" id="vfs">全螢幕</button><button type="button" id="vclose">關閉</button></div>
  <div class="vnote" id="vnote" hidden></div>
  <div id="vbody" style="flex:1;display:flex;min-height:0"></div>
</div>

<script>
/* ===== 設定：部署 GAS 後把網址貼到 API_URL；留空＝示範模式 ===== */
const CONFIG = {
  API_URL: 'https://script.google.com/macros/s/AKfycbx8HViEQEVPnJhGWogNhtGeFMc8N8So9p8FkpBivf6VBHo4StmLR8VrxZZwAdzPhb34wQ/exec',   // 本系統 GAS 網址；留空＝示範模式
  AUTH: 'simple',      // 'simple'＝本網站簡易登入；帳號中心接好後改成 'center'（系統代碼 meeting）
  LEARN_URL: 'https://cych05845-jpg.github.io/er-learn/',  // ER-Learn 網址，請確認
  BOARD_URL: 'https://cych05845-jpg.github.io/ed-board/',   // 急診必看板

/* ===== 讀取快取：同一筆資料 60 秒內不重抓；任何寫入動作會清空快取 ===== */
const READS = new Set(['listMeetings','listAnnouncements','listPolls','listProposals','listDecisions','getMeeting','listAttendance','getMinutes','getFile','listMinutesLog']);
const qcache = new Map();
const qkey = (a, b) => a + '|' + JSON.stringify(b||{});
const clone = x => x == null ? x : JSON.parse(JSON.stringify(x));
let busyN = 0;
function busy(d){ busyN = Math.max(0, busyN + d); const b = document.getElementById('busy'); if (b) b.hidden = busyN === 0; }
async function api(action, body={}){
  if (READS.has(action)) {
    const h = qcache.get(qkey(action, body));
    if (h && Date.now() - h.t < (action==='getFile' ? 6e5 : 6e4)) return clone(h.data);
  } else qcache.clear();
  busy(1);
  try { const d = await apiRaw(action, body); if (READS.has(action)) qcache.set(qkey(action, body), {t:Date.now(), data:clone(d)}); return d; }
  finally { busy(-1); }
}
/** 一次送出多個讀取（首頁、會議頁），結果也放進快取 */
async function apiBatch(calls){
  const todo = calls.filter(([a,b]) => { const h = qcache.get(qkey(a,b)); return !(h && Date.now()-h.t < 6e4); });
  if (todo.length) {
    busy(1);
    try {
      const res = DEMO ? await Promise.all(todo.map(([a,b])=>mock(a,b||{}).then(data=>({ok:true,data})).catch(e=>({ok:false,error:e.message}))))
                       : await apiRaw('batch', {calls: todo.map(([a,b])=>({action:a, ...(b||{})}))});
      res.forEach((r,i) => { if (!r.ok) throw new Error(r.error); qcache.set(qkey(todo[i][0], todo[i][1]), {t:Date.now(), data:clone(r.data)}); });
    } finally { busy(-1); }
  }
  return calls.map(([a,b]) => clone(qcache.get(qkey(a,b)).data));
}
async function apiRaw(action, body={}){
  if (DEMO) return mock(action, body);
  let j;
  if (CENTER()) j = await EDAuth.api(CONFIG.API_URL, {action, ...body});   // 帳號中心 token；過期會跳出登入後重送
  else {
    const r = await fetch(CONFIG.API_URL, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({action, token: session?.token, ...body})});
    j = await r.json();
    if (!j.ok && j.error === 'AUTH_REQUIRED') { logout(true); throw new Error('請重新登入'); }
  }
  if (!j.ok) throw new Error(j.error === 'FORBIDDEN' ? '沒有權限' : j.error);
  return j.data;
}
function logout(expired){
  if (CENTER()) return EDAuth.logout();
  session = null; store.del('erm_session'); qcache.clear(); if (expired) toast('登入已過期，請重新登入'); location.hash = '#/home'; render();
}

/* ===== 投票 ===== */
function pollCard(p, compact){
  const max = p.counts ? Math.max(...p.counts) : 0;
  const pct = i => p.total ? Math.round(p.counts[i]/p.total*100) : 0;
  return `<div class="${compact?'':'card '}poll" data-poll="${esc(p.poll_id)}">
    <div class="row between"><h2>${esc(p.question)}</h2>
    <div class="row"><span class="chip ${p.open?'hot':''}">${p.open?'進行中':'已截止'}${p.close_at?'・截止 '+esc(p.close_at):''}</span>${p.open?`<button class="btn sm" type="button" data-pollqr data-q="${esc(p.question)}">投票 QR</button>`:''}</div></div>
    <div class="muted small">不記名、一人一票，系統只記錄是否投過，不記錄投給誰。已投 ${p.total} 票${compact?'':'・<a href="#/m/'+esc(p.meeting_id)+'">'+esc(p.meeting_id)+' 會議</a>'}</div>
    ${p.counts ? `<div class="opt">${p.options.map((o,i)=>`<div class="bar ${p.counts[i]===max&&max>0?'win':''}"><i style="width:${pct(i)}%"></i><span><b>${esc(o)}</b><span>${p.counts[i]} 票・${pct(i)}%</span></span></div>`).join('')}</div>${p.voted?'<div class="muted small" style="margin-top:8px">您已投票</div>':''}` : ''}
    ${p.open && !p.voted ? `<div class="vote-btns">${p.options.map(o=>`<button class="btn" type="button" data-vote="${esc(o)}">${esc(o)}</button>`).join('')}</div>` : ''}
    ${!compact && isAdmin() ? `<details class="mgr"><summary>管理這個投票</summary><form class="stack" style="gap:10px;margin-top:8px" data-pedit>
      <div class="grid2"><label class="f">題目<input name="question" value="${esc(p.question)}"></label><label class="f">截止日<input name="close_at" type="date" value="${esc(String(p.close_at||'').slice(0,10))}"></label></div>
      <label class="f">選項（一行一個）${p.total?'<span class="muted small">已有人投票，選項不能修改</span>':''}<textarea name="options" ${p.total?'disabled':''}>${esc(p.options.join('\n'))}</textarea></label>
      <div class="row"><button class="btn primary sm" type="submit">儲存</button><button class="btn sm" type="button" data-pstat="${p.open?'closed':'open'}">${p.open?'提前截止':'重新開放'}</button><button class="btn sm danger" type="button" data-pdel>刪除投票</button></div></form></details>` : ''}
  </div>`;
}
function bindPolls(root){
  root.querySelectorAll('[data-poll]').forEach(card=>{
    const pe = card.querySelector('[data-pedit]');
    if (pe) { const pid = card.dataset.poll; const compact = !card.classList.contains('card');
      const upd = async (poll, msg) => { try{ const p = await api('updatePoll',{poll_id:pid, poll}); card.outerHTML = pollCard(p, compact); bindPolls(root); toast(msg); }catch(e){toast(e.message)} };
      pe.onsubmit = e => { e.preventDefault(); const fd=new FormData(pe); const poll={question:fd.get('question'), close_at:fd.get('close_at')}; if(!pe.options.disabled) poll.options=String(fd.get('options')).split('\n'); upd(poll,'已更新投票'); };
      pe.querySelector('[data-pstat]').onclick = ev => upd({status:ev.target.dataset.pstat}, ev.target.dataset.pstat==='closed'?'已截止':'已重新開放');
      pe.querySelector('[data-pdel]').onclick = async () => { if(!confirm('刪除投票會連同所有票數一起刪除，確定嗎？')) return; try{ await api('deletePoll',{poll_id:pid}); card.remove(); toast('已刪除投票'); }catch(e){toast(e.message)} };
    }
    const qb = card.querySelector('[data-pollqr]');
    if (qb) qb.onclick = () => openQR({eyebrow:'現場投票', title:qb.dataset.q, desc:'手機掃描 → 登入 → 投票（不記名、一人一票）', url:SITE()+'#/vote/'+card.dataset.poll});
    card.querySelectorAll('[data-vote]').forEach(btn=>btn.onclick=async()=>{
      card.querySelectorAll('button').forEach(x=>x.disabled=true);
      try{ const p=await api('vote',{poll_id:card.dataset.poll,option:btn.dataset.vote}); card.outerHTML=pollCard(p, !card.classList.contains('card')); toast('已投票，謝謝！'); }
      catch(e){ toast(e.message); card.querySelectorAll('button').forEach(x=>x.disabled=false); }
    });
  });
}
async function renderPolls(app){
  const polls = await api('listPolls');
  const open = polls.filter(p=>p.open), closed = polls.filter(p=>!p.open);
  app.innerHTML = `<div class="stack">${demoBanner()}${pageHead('投票','會議投票', isAdmin()?'<a class="btn primary" href="#/admin">＋ 新增投票</a>':'')}

  bindPolls(app);
}

function decTable(list, withMeeting, editable){
  if(!list.length) return `<div class="empty">沒有決議事項</div>`;
  return `<div class="tbl"><table><thead><tr>${withMeeting?'<th>會議</th>':''}<th>事項</th><th>負責人</th><th>期限</th><th>狀態</th><th>進度說明</th>${editable?'<th></th>':''}</tr></thead><tbody>
  ${list.map(d=>`<tr class="${isOverdue(d)?'overdue':''}">${withMeeting?`<td><a href="#/m/${esc(d.meeting_id)}">${esc(d.meeting_id)}</a></td>`:''}<td class="item">${esc(d.item)}</td><td>${esc(d.owner)}</td><td style="white-space:nowrap">${esc(String(d.due||'').slice(0,10))}${isOverdue(d)?`<br><span class="chip hot">逾期 ${daysLate(d)} 天</span>`:''}</td>

async function renderDecisions(app){
  const all = await api('listDecisions');
  let filter = all.some(isOverdue) ? '逾期' : '未完成';
  const match = (d, s) => s==='全部' || (s==='未完成' ? d.status!=='已完成' : s==='逾期' ? isOverdue(d) : d.status===s);
  const FILTERS = ['逾期','未完成','未開始','進行中','持續追蹤','已完成','全部'];
  const draw = () => {
    app.querySelector('.filters').innerHTML = FILTERS.map(s=>`<button type="button" data-f="${s}" aria-pressed="${s===filter}">${s}（${all.filter(d=>match(d,s)).length}）</button>`).join('');
    app.querySelectorAll('.filters button').forEach(b=>b.onclick=()=>{filter=b.dataset.f;draw()});
    const list = all.filter(d => match(d, filter));
    $('#dt').innerHTML = decTable(list, true, isAdmin());
    $('#dt').querySelectorAll('[data-dec]').forEach(sel=>sel.onchange=async()=>{
      const d = all.find(x=>x.dec_id===sel.dataset.dec); d.status = sel.value;
      try{ await api('saveDecision',{decision:d}); toast('已更新狀態'); draw(); }catch(e){ toast(e.message); } });
    $('#dt').querySelectorAll('[data-dedit]').forEach(b=>b.onclick=()=>{
      const d = all.find(x=>x.dec_id===b.dataset.dedit); const tr = b.closest('tr');
      tr.insertAdjacentHTML('afterend', `<tr><td colspan="7"><form class="edit-box stack" style="gap:10px">
        <label class="f">事項<input name="item" required value="${esc(d.item)}"></label>
        <div class="grid2"><label class="f">負責人<input name="owner" value="${esc(d.owner||'')}"></label><label class="f">期限<input name="due" type="date" value="${esc(String(d.due||'').slice(0,10))}"></label>
        <label class="f">狀態<select name="status">${STATUS.map(s=>`<option ${s===d.status?'selected':''}>${s}</option>`).join('')}</select></label></div>
        <label class="f">進度說明<input name="note" value="${esc(d.note||'')}"></label>
        <div class="row between"><button class="btn sm danger" type="button" data-del>刪除這項決議</button><div class="row"><button class="btn" type="button" data-cancel>取消</button><button class="btn primary" type="submit">儲存</button></div></div></form></td></tr>`);
      const f = tr.nextElementSibling.querySelector('form'); b.disabled = true;
      f.querySelector('[data-cancel]').onclick = draw;
      f.querySelector('[data-del]').onclick = async () => { if(!confirm('確定刪除這項決議？')) return; try{ await api('deleteDecision',{dec_id:d.dec_id}); all.splice(all.indexOf(d),1); toast('已刪除'); draw(); }catch(e){toast(e.message)} };
      f.onsubmit = async e => { e.preventDefault(); const fd = new FormData(f); const n = {...d, item:fd.get('item'), owner:fd.get('owner'), due:fd.get('due'), status:fd.get('status'), note:fd.get('note')};
        try{ await api('saveDecision',{decision:n}); Object.assign(d, n); toast('已更新'); draw(); }catch(err){toast(err.message)} };
    });
  };
  app.innerHTML = `<div class="stack">${demoBanner()}${pageHead('決議追蹤','歷次會議決議與執行狀態')}
    <div class="filters"></div>
    <div class="card" id="dt"></div></div>`;
  draw();
}

// 支援帳號中心整列（員編 姓名 類別 職稱 權限 啟用 …）或「員編 姓名 [admin]」
function parseStaffLine(line){
  const t = line.replace(/\r/g,'');
  if (!t.trim()) return null;
  const a = (t.includes('\t') ? t.split('\t') : t.trim().split(/[ ,，]+/)).map(s=>s.trim());
  if (!a[0] || !a[1] || a[0]==='員編') return null;
  if (a.length >= 6) {
    const admin = /account\.admin|meeting\.admin/.test(a[4]||'') || /護理長/.test(a[3]||'');
    return { staff_id:a[0], name:a[1], role: admin?'admin':'rn', status: a[5]==='否' ? '停用' : '在職' };
  }
  return { staff_id:a[0], name:a[1], role: /admin|管理/i.test(a[2]||'') ? 'admin' : 'rn' };
}

async function renderStaffAdmin(app){
  const box = document.createElement('section'); box.className = 'card stack'; app.querySelector('.stack').appendChild(box);
  const draw = async () => {
    const list = await api('listStaff');
    box.innerHTML = `<div class="row between"><h2>人員名單（${list.length} 人）</h2><span class="muted small">帳號中心接好後可停用此名單</span></div>
      <label class="f" for="st_paste">新增同仁：可直接從帳號中心「人員」分頁整列複製貼上（含標題列也可以）；或一行一位「員編 姓名」，管理者在後面加 admin
        <textarea id="st_paste" placeholder="12345 王小明&#10;23456 李小華 admin"></textarea></label>
      <div><button class="btn primary" type="button" id="st_add">加入名單並產生臨時 PIN</button></div>
      <div id="st_out"></div>
      <div class="tbl"><table><thead><tr><th>員編</th><th>姓名</th><th>角色</th><th>狀態</th><th></th></tr></thead><tbody>
      ${list.map(s=>`<tr><td>${esc(s.staff_id)}</td><td>${esc(s.name)}</td><td>${s.role==='admin'?'管理者':'同仁'}</td><td>${esc(s.status||'在職')}${s.must_change==='yes'?'・待改 PIN':''}</td>
        <td style="white-space:nowrap"><button class="btn" type="button" data-reset="${esc(s.staff_id)}">重設 PIN</button>
        <button class="btn" type="button" data-toggle="${esc(s.staff_id)}">${s.status==='停用'?'啟用':'停用'}</button></td></tr>`).join('')}</tbody></table></div>`;
    const showPins = (rows) => { $('#st_out').innerHTML = rows.length ? `<div class="banner">請把臨時 PIN 個別告知同仁，第一次登入會要求改 PIN。此清單只顯示這一次。<br>${rows.map(r=>`${esc(r.staff_id)} ${esc(r.name)}：<b>${esc(r.pin)}</b>`).join('<br>')}</div>` : '<div class="muted small">沒有新增的同仁（已在名單中的只更新姓名與角色）</div>'; };
    $('#st_add').onclick = async () => {
      const staff = $('#st_paste').value.split('\n').map(parseStaffLine).filter(Boolean);
      if (!staff.length) return toast('請貼上「員編 姓名」');
      try { const r = await api('saveStaff',{staff}); await draw(); showPins(r.added); } catch(e){ toast(e.message); } };
    box.querySelectorAll('[data-reset]').forEach(b=>b.onclick=async()=>{ try{ const r=await api('resetPin',{staff_id:b.dataset.reset}); showPins([r]); }catch(e){toast(e.message)} });
    box.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=async()=>{ const s=list.find(x=>x.staff_id===b.dataset.toggle);
      try{ await api('saveStaff',{staff:[{...s,status:s.status==='停用'?'在職':'停用'}]}); toast('已更新'); draw(); }catch(e){toast(e.message)} });
  };
  try { await draw(); } catch(e) { box.innerHTML = `<h2>人員名單</h2><div class="muted">${esc(e.message)}</div>`; }
}

/* ===== 上傳與附件 ===== */
const FILE_ACCEPT = '.html,.htm,.pdf,image/*,.doc,.docx,.xls,.xlsx,.ppt,.pptx';
const MIME_BY_EXT = {html:'text/html',htm:'text/html',pdf:'application/pdf',doc:'application/msword',xls:'application/vnd.ms-excel',ppt:'application/vnd.ms-powerpoint',
  docx:'application/vnd.openxmlformats-officedocument.wordprocessingml.document',xlsx:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',pptx:'application/vnd.openxmlformats-officedocument.presentationml.presentation'};
async function uploadOne(mid, kind, f){
  if (f.size > 25*1048576) throw new Error('檔案超過 25MB');
  const ext = (f.name.split('.').pop()||'').toLowerCase();
  const mime = MIME_BY_EXT[ext] || f.type || '';
  return api('uploadFile',{meeting_id:mid, kind, name: /^html?$/.test(ext) ? f.name.replace(/\.html?$/i,'') : f.name, mime, base64: await fileB64(f)});
}
function renderAtts(id, d){
  const box = $('#atts'); if (!box) return;
  const can = d.can_scribe || isAdmin();
  const list = numberAtts(d.attachments);
  curMeet.atts = list;
  box.innerHTML = `<div class="row between"><h2>附件</h2><span class="muted small">會議紀錄引用時寫「（附件一）」</span></div>
    <div class="files">${list.map(a=>`<div class="file"><span class="att-no">${a.no}</span><span class="chip">${esc(a.kind||'附件')}</span><span class="n">${esc(a.name)}${a.url?`<br><span class="muted small">${esc(a.url)}</span>`:''}</span>
      <button class="btn sm" type="button" data-open="${esc(a.att_id)}">開啟</button>${can && (isAdmin()||a.kind!=='會議報告')?`<button class="btn sm" type="button" data-del="${esc(a.att_id)}" aria-label="刪除 ${esc(a.name)}">刪除</button>`:''}</div>`).join('') || '<div class="empty">還沒有附件</div>'}</div>
    ${can?`<div class="addbox stack" style="gap:10px">
      <form class="grid2" id="lk" style="grid-template-columns:minmax(0,1fr) minmax(0,2fr) auto;align-items:end">
        <label class="f" for="lk_n">附件名稱<input id="lk_n" placeholder="例：9月品質指標報告"></label>
        <label class="f" for="lk_u">網址<input id="lk_u" type="url" placeholder="https://drive.google.com/…" required></label>
        <button class="btn primary" type="submit">加入網址</button></form>
      <form class="row" id="up"><label class="f" for="up_f" style="flex:1">或上傳檔案（PDF、圖片、Word／Excel／PowerPoint，25MB 以內）<input id="up_f" type="file" accept="${FILE_ACCEPT}" required></label><button class="btn" type="submit">上傳附件</button></form>
      <div class="muted small">雲端硬碟的網址請確認同仁有權限開啟（建議分享給院內帳號，不要開「知道連結的任何人」）。</div></div>`:''}`;
  box.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openFile(b.dataset.open));
  const refresh = async () => { const nd = await api('getMeeting',{meeting_id:id}); curMeet.d = nd; renderAtts(id, nd); };
  box.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{ if(!confirm('確定刪除這個附件？')) return; try{ await api('deleteFile',{att_id:b.dataset.del}); toast('已刪除'); refresh(); }catch(e){toast(e.message)} });
  const lk = $('#lk'); if (lk) lk.onsubmit = async e => { e.preventDefault(); try{ await api('addLink',{meeting_id:id,name:$('#lk_n').value.trim(),url:$('#lk_u').value.trim()}); toast('已加入附件'); refresh(); }catch(err){toast(err.message)} };
  const up = $('#up'); if (up) up.onsubmit = async e => { e.preventDefault(); const f=$('#up_f').files[0]; if(!f) return; try{ toast('上傳中…'); await uploadOne(id,'附件',f); toast('已上傳'); refresh(); }catch(err){toast(err.message)} };
}

function beep(ok){ try{ const c=new (window.AudioContext||window.webkitAudioContext)(); const o=c.createOscillator(); const g=c.createGain(); o.frequency.value=ok?880:220; g.gain.value=.08; o.connect(g); g.connect(c.destination); o.start(); o.stop(c.currentTime+(ok?.12:.3)); }catch(_){} }
function loadScript(src){ return new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=rej; document.head.appendChild(s); }); }

      <form id="kf"><label class="f" for="k_in">刷員工證、掃條碼，或輸入員編後按 Enter<input id="k_in" class="kin" autocomplete="off" autocorrect="off" spellcheck="false" inputmode="numeric" enterkeyhint="done"></label></form>

      <div id="k_reader"></div>
      <div class="muted small">USB 條碼槍、讀卡機會自動把號碼打進上面的框；手機請按「用手機相機掃條碼」。同一人重複刷不會重複計算。</div>
    </div>
    <section class="card"><h2 style="margin-bottom:10px">已簽到</h2><div id="k_list"></div></section></div>`;
  const inp = $('#k_in'), msg = $('#k_msg');

      beep(true); show(r.already?'warn':'ok', r.already ? `${r.name||code} 已經簽到過` : `✓ ${r.name||code}${r.title?'（'+r.title+'）':''}　${status}`);
      drawList(await api('listAttendance',{meeting_id:id})); }
    catch(e){ beep(false); show('bad', e.message); }
  };
  $('#kf').onsubmit = e => { e.preventDefault(); const v = inp.value; inp.value=''; submit(v, '刷卡／輸入員編'); };
  app.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{ status=b.dataset.s; app.querySelectorAll('[data-s]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.s===status)); inp.focus(); });
  $('#k_nm').onclick = async () => { const n = prompt('輸入姓名（沒有員編的人員，例如外單位）'); if(!n) return;
    try{ await api('checkin',{meeting_id:id,name:n.trim(),status,method:'手動輸入'}); beep(true); show('ok', `✓ ${n.trim()}　${status}`); drawList(await api('listAttendance',{meeting_id:id})); }catch(e){ beep(false); show('bad', e.message); } };
  $('#k_cam').onclick = async () => {
    if (scanner) { stopScanner(); $('#k_reader').innerHTML=''; $('#k_cam').textContent='用手機相機掃條碼'; return; }
    try { if (!window.Html5Qrcode) { try { await loadScript('https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js'); } catch(_) { await loadScript('https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js'); } }
      const F = window.Html5QrcodeSupportedFormats;
      scanner = new Html5Qrcode('k_reader', {formatsToSupport:[F.CODE_128,F.CODE_39,F.CODE_93,F.CODABAR,F.EAN_13,F.ITF,F.QR_CODE], verbose:false});
      await scanner.start({facingMode:'environment'}, {fps:10, qrbox:{width:280,height:130}, experimentalFeatures:{useBarCodeDetectorIfSupported:true}}, t=>submit(t,'掃條碼'), ()=>{});
      $('#k_cam').textContent='關閉相機'; show('', '對準員工證條碼…');
    } catch(e){ stopScanner(); show('bad', '無法開啟相機：請允許相機權限，或改用刷卡／輸入員編'); }
  };
  document.addEventListener('click', function keep(e){ if (!document.body.contains(inp)) return document.removeEventListener('click', keep); if (!scanner && !e.target.closest('button,a,input,select,label')) inp.focus(); });
  inp.focus();
}

/* ===== 會議現場（同仁掃 QR 進來：簽到＋投票） ===== */
async function renderLive(app, id){
  const [d, a] = await apiBatch([['getMeeting',{meeting_id:id}],['listAttendance',{meeting_id:id}]]);
  const m = d.meeting; const open = d.polls.filter(p=>p.open);
  app.innerHTML = `<div class="stack bigpoll">${demoBanner()}
    <section class="card hero"><div><div class="eyebrow">會議現場</div><h1>${esc(m.title)}</h1><div class="meta">${esc(m.date)}　｜　${esc(session.name)}</div></div></section>
    <section class="card stack"><h2>簽到</h2>${a.me?`<div class="kmsg ok">✓ 您已簽到（${esc(a.me)}）</div>`: a.today||a.can_edit ? `<button class="btn primary big" type="button" id="selfIn">我已到場，簽到</button>` : `<div class="muted">會議當天（${esc(m.date)}）才能自行簽到</div>`}</section>
    ${open.length ? open.map(p=>pollCard(p)).join('') : '<div class="card empty">目前沒有進行中的投票</div>'}
    <div><a href="#/m/${esc(id)}">查看完整會議資料 →</a></div></div>`;
  const si = $('#selfIn'); if (si) si.onclick = async () => { si.disabled=true; try{ await api('checkin',{meeting_id:id}); toast('簽到完成'); renderLive(app, id); }catch(e){ toast(e.message); si.disabled=false; } };
  bindPolls(app);
}
async function renderVote(app, pid){
  const p = (await api('listPolls')).find(x=>x.poll_id===pid);
  if (!p) { app.innerHTML = '<div class="card">找不到這個投票，可能尚未公開或已刪除。</div>'; return; }
  app.innerHTML = `<div class="stack bigpoll">${demoBanner()}${pollCard(p)}<div><a href="#/polls">全部投票 →</a></div></div>`;
  bindPolls(app);
}

/* ===== 檔案檢視：登入後才從後端取檔，不公開雲端硬碟連結 ===== */
const REPORT_PRINT_CSS = `@page{size:1920px 1080px;margin:0}
html,body{height:auto!important;overflow:visible!important;background:#fff!important}
#bar,#notes,#help{display:none!important}
#viewport{position:static!important;display:block!important}
#deck{transform:none!important;width:1920px!important;height:auto!important;position:static!important}
#deck>section{position:relative!important;inset:auto!important;opacity:1!important;visibility:visible!important;transform:none!important;box-shadow:none!important;transition:none!important;break-after:page;page-break-after:always}
#deck [data-build-in]{opacity:1!important;transform:none!important;transition:none!important}
*{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}`;
/** 產生 PDF：在隱藏框架開啟列印視窗，選「另存為 PDF」（手機選「分享 › 儲存為 PDF」） */
function printDoc(html, css){
  toast('列印視窗開啟後，目的地選「另存為 PDF」');
  const fr = document.createElement('iframe');
  fr.setAttribute('sandbox','allow-scripts allow-modals'); fr.title = '列印';
  fr.style.cssText = 'position:fixed;right:0;bottom:0;width:1200px;height:800px;border:0;opacity:0;pointer-events:none';
  const inj = `<style>${css||''}@media print{*{-webkit-print-color-adjust:exact;print-color-adjust:exact}}</style><script>addEventListener('load',function(){setTimeout(function(){print()},900)})<\/script>`;
  fr.srcdoc = /<\/head>/i.test(html) ? html.replace(/<\/head>/i, inj + '</head>') : '<!doctype html><html><head><meta charset="utf-8">' + inj + '</head><body>' + html + '</body></html>';
  document.body.appendChild(fr); setTimeout(() => fr.remove(), 180000);
}
function saveBlob(blob, name){ const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href), 60000); }
/** 外部網址轉成可在網站內顯示的版本：Google 雲端硬碟／文件／簡報／試算表用 preview，並提供下載與 PDF 匯出 */
function linkInfo(u){
  let m;
  if ((m = /docs\.google\.com\/(document|presentation|spreadsheets)\/d\/([\w-]+)/.exec(u))) {
    const t = m[1], id = m[2];
    return { embed:`https://docs.google.com/${t}/d/${id}/preview`, pdf: t==='presentation' ? `https://docs.google.com/presentation/d/${id}/export/pdf` : `https://docs.google.com/${t}/d/${id}/export?format=pdf`, google:true };
  }
  if (/drive\.google\.com/.test(u) && (m = /\/file\/d\/([\w-]+)/.exec(u) || /[?&]id=([\w-]+)/.exec(u)))
    return { embed:`https://drive.google.com/file/d/${m[1]}/preview`, dl:`https://drive.google.com/uc?export=download&id=${m[1]}`, google:true };
  if (/\.pdf(\?|#|$)/i.test(u)) return { embed:u, dl:u, pdf:u };
  return { embed:u };
}
function viewerSetup(title, opts){
  const v=$('#viewer'); v.hidden=false; $('#vtitle').textContent = title;
  const set = (id, fn) => { const b=$(id); b.hidden = !fn; if (fn) b.onclick = fn; };
  set('#vdl', opts.dl); set('#vpdf', opts.pdf);
  const ext = $('#vext'); ext.hidden = !opts.ext; if (opts.ext) ext.href = opts.ext;
  const n = $('#vnote'); n.hidden = !opts.note; n.textContent = opts.note || '';
}
async function openFile(id){
  const att = (curMeet?.d.attachments||[]).find(a=>a.att_id===id);
  const body=$('#vbody');
  if (att && att.url) {
    const L = linkInfo(att.url);
    viewerSetup(att.name, { ext: att.url, dl: L.dl ? ()=>window.open(L.dl,'_blank','noopener') : null, pdf: L.pdf ? ()=>window.open(L.pdf,'_blank','noopener') : null,
      note: L.google ? '雲端硬碟檔案需用有權限的 Google 帳號登入才看得到；看不到請按「新分頁開啟」。' : '有些網站不允許嵌入顯示，空白的話請按「新分頁開啟」。' });
    const fr = document.createElement('iframe'); fr.src = L.embed; fr.title = att.name; fr.setAttribute('allow','fullscreen'); fr.setAttribute('allowfullscreen','');
    fr.setAttribute('referrerpolicy','no-referrer'); body.replaceChildren(fr); return;
  }
  viewerSetup(att?.name || '載入中…', {});
  body.innerHTML='<div class="empty" style="color:#bbb;flex:1">載入中…（第一次開啟較久，之後 10 分鐘內會很快）</div>';
  try{
    const f = await api('getFile',{att_id:id});
    if (f.url) { $('#viewer').hidden=true; return window.open(f.url,'_blank','noopener'); }
    const bytes = () => Uint8Array.from(atob(f.base64), c=>c.charCodeAt(0));
    let html = f.text;
    if (!html && f.mime==='text/html') html = new TextDecoder().decode(bytes());
    if (!/^(text\/html|application\/pdf|image\/)/.test(f.mime)) { $('#viewer').hidden=true; saveBlob(new Blob([bytes()],{type:f.mime}), f.name); return toast('已下載 '+f.name+'（Word／PPT 請另存 PDF 上傳，就能在網站內直接看）'); }
    if (f.mime==='text/html'){
      viewerSetup(f.name, { dl: ()=>saveBlob(new Blob([html],{type:'text/html'}), f.name.replace(/\.html?$/i,'')+'.html'), pdf: ()=>printDoc(html, REPORT_PRINT_CSS) });
      const fr=document.createElement('iframe'); fr.setAttribute('sandbox','allow-scripts'); fr.setAttribute('allow','fullscreen'); fr.setAttribute('allowfullscreen',''); fr.title=f.name; fr.srcdoc=html; body.replaceChildren(fr); setTimeout(()=>fr.focus(),300);
    } else {
      const blob = new Blob([bytes()],{type:f.mime}); const url = URL.createObjectURL(blob);
      const isImg = f.mime.startsWith('image/');
      viewerSetup(f.name, { dl: ()=>saveBlob(blob, f.name), pdf: isImg ? ()=>printDoc(`<img src="data:${f.mime};base64,${f.base64}" style="max-width:100%">`, '@page{margin:10mm}') : ()=>saveBlob(blob, /\.pdf$/i.test(f.name)?f.name:f.name+'.pdf') });
      const el = isImg ? Object.assign(document.createElement('img'),{src:url,alt:f.name}) : Object.assign(document.createElement('iframe'),{src:url,title:f.name});
      body.replaceChildren(el);
    }
  }catch(e){ body.innerHTML=`<div class="empty" style="color:#ddd;flex:1">${esc(e.message)}</div>`; }
}
$('#vclose').onclick=()=>{ $('#viewer').hidden=true; $('#vbody').innerHTML=''; };
$('#vfs').onclick=()=>{ try{ document.fullscreenElement?document.exitFullscreen():$('#viewer').requestFullscreen().catch(()=>{}); }catch(_){} };
addEventListener('keydown',e=>{ if(e.key==='Escape' && !$('#qrModal').hidden) $('#qrClose').click(); if(e.key==='Escape' && !$('#viewer').hidden && !document.fullscreenElement) $('#vclose').click(); });
